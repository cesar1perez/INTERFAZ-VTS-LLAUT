<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Tulancingo</title>
    <!-- Preconexiones para acelerar handshake TLS con CDNs -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://docs.google.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Críticos (bloquean render): Tailwind + PapaParse. Sin ellos el dashboard no arma UI ni lee CSV. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- FontAwesome: se carga en paralelo, si tarda no bloquea el render. Los íconos aparecen 200-400ms después. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></noscript>
    <!-- Fuente Inter: display=swap = usa fuente del sistema mientras Google Fonts baja -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Chart.js y html2pdf se cargan SOLO cuando se abren los módulos que los necesitan (Gráficas / PDF).
         Esto quita ~450 KB del arranque inicial. Ver funciones cargarChartJs() y cargarHtml2Pdf() en el JS. -->
    <script>
        // Helper para cargar scripts on-demand con promesa
        window.__cachedScripts = {};
        function loadScriptOnce(src){
            if(window.__cachedScripts[src]) return window.__cachedScripts[src];
            window.__cachedScripts[src] = new Promise((resolve, reject)=>{
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = ()=>resolve();
                s.onerror = ()=>{ delete window.__cachedScripts[src]; reject(new Error('No se pudo cargar '+src)); };
                document.head.appendChild(s);
            });
            return window.__cachedScripts[src];
        }
        function cargarChartJs(){
            return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js');
        }
        function cargarHtml2Pdf(){
            return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
        }
    </script>
    <style>
        /* ===== SISTEMA DE TEMAS (RDV style) ===== */
        :root, [data-theme="light"]{
            --bg:#eef2f7; --surface:#ffffff; --surface-2:#f1f5f9; --border:#e2e8f0;
            --text:#0f172a; --muted:#64748b; --navy:#001529; --navy-2:#002d54; --brand:#002d54;
            --accent:#f5b700; --on-accent:#001529; --good:#16a34a; --bad:#dc2626;
            --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
        }
        [data-theme="dark"]{
            --bg:#070f1a; --surface:#0d1b2e; --surface-2:#12233b; --border:rgba(255,255,255,.09);
            --text:#e6eef7; --muted:#8aa0b8; --navy:#001019; --navy-2:#00284c; --brand:#7db3ff;
            --accent:#f5b700; --on-accent:#001529; --good:#22c55e; --bad:#f87171;
            --shadow:0 1px 3px rgba(0,0,0,.45);
        }
        *{ -webkit-tap-highlight-color:transparent; }
        body{ font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); transition:background .25s ease,color .25s ease; }

        /* Utilidades temáticas */
        .surface{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); }
        .surface-2{ background:var(--surface-2); }
        .navy{ background:var(--navy); }
        .navy-grad{ background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%); }
        .txt{ color:var(--text); } .muted{ color:var(--muted); }
        .accent{ color:var(--accent); }
        .chip-accent{ background:var(--accent); color:var(--on-accent); }
        .chip-navy{ background:var(--navy); color:var(--accent); }
        .bd{ border-color:var(--border); }
        .c-good{ color:var(--good); } .c-bad{ color:var(--bad); }
        .bg-good{ background:var(--good); } .bg-bad{ background:var(--bad); }

        .glass-btn{ transition:all .18s ease; cursor:pointer; }
        .glass-btn:active{ transform:scale(.98); }

        /* barras de zona (color acento por índice) */
        .zline-0{ border-left-color:#ef4444 !important; }
        .zline-1{ border-left-color:#3b82f6 !important; }
        .zline-2{ border-left-color:#10b981 !important; }
        .zline-3{ border-left-color:#f59e0b !important; }
        .zline-4{ border-left-color:#8b5cf6 !important; }
        .zline-5{ border-left-color:#ec4899 !important; }

        .dropdown-content{ max-height:0; overflow:hidden; transition:max-height .4s ease-in-out; }
        .dropdown-active .dropdown-content{ max-height:8000px; padding-top:18px; overflow:visible; }

        select.themed{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
        select.themed:focus{ outline:2px solid var(--accent); }

        .cmp-cell{ background:var(--surface); border:1px solid var(--border); border-radius:16px; }
        #cmp-results td, #cmp-results th, #cmp-annual td, #cmp-annual th{ white-space:nowrap; }
        .cmp-hi{ box-shadow:0 0 0 2px var(--good) inset; }
        .cmp-lo{ box-shadow:0 0 0 2px var(--bad) inset; }

        /* ===================== ESTRATEGIA ACUMULADORES JULIO 2026 ===================== */
        .ea-jul26{
          --ea-navy:#001529; --ea-navy2:#0c1f44; --ea-gold:#facc15; --ea-gold2:#eab000;
          --ea-cyan:#3aa6ff; --ea-good:#10b981; --ea-mid:#f59e0b; --ea-low:#ef4444;
          --ea-ink:#0c1f44; --ea-muted:#4a5a7a; --ea-line:#e5ebf5; --ea-bg:#f8fafc;
          font-family:'Inter',system-ui,sans-serif;
          background:linear-gradient(135deg,#0c1f44 0%,#001529 100%);
          color:#fff; border-radius:20px; padding:26px 28px 22px;
          box-shadow:0 30px 80px -30px rgba(0,0,0,.5);
          margin:20px 0 30px; position:relative; overflow:hidden;
        }
        .ea-jul26::before{content:"";position:absolute;top:-40%;right:-8%;width:55%;height:180%;
          background:radial-gradient(circle,rgba(58,166,255,.10) 0%,transparent 60%);pointer-events:none}
        .ea-jul26 *{box-sizing:border-box}
        .ea-jul26-badge{display:inline-flex;align-items:center;gap:8px;
          background:linear-gradient(135deg,rgba(58,166,255,.22),rgba(58,166,255,.10));
          border:1px solid rgba(58,166,255,.45); color:#7cc4ff;
          padding:7px 14px;border-radius:20px;font-weight:800;font-size:11px;
          letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px;position:relative;z-index:1}
        .ea-jul26-dot{width:8px;height:8px;border-radius:50%;background:var(--ea-cyan);box-shadow:0 0 0 4px rgba(58,166,255,.25)}
        .ea-jul26-head{position:relative;z-index:1;margin-bottom:20px}
        .ea-jul26-tag{color:var(--ea-gold);font-weight:800;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
        .ea-jul26-title{font-style:italic;font-weight:900;
          font-size:clamp(22px,3vw,32px);margin:0 0 6px;line-height:1.1;color:#fff}
        .ea-jul26-title span{color:var(--ea-gold)}
        .ea-jul26-sub{font-size:13px;color:#c9d6ec;margin:0;line-height:1.5}
        .ea-jul26-sub b{color:#fff}
        .ea-jul26-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px;position:relative;z-index:1}
        .ea-jul26-kpi{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
          border-radius:12px;padding:14px 16px;transition:.2s}
        .ea-jul26-kpi:hover{border-color:rgba(255,210,30,.35);transform:translateY(-1px)}
        .ea-jul26-k-l{font-size:10.5px;font-weight:800;color:#8093b3;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
        .ea-jul26-k-v{font-family:'Inter',monospace;font-size:26px;font-weight:900;color:#fff;line-height:1;margin-bottom:4px}
        .ea-jul26-k-s{font-size:11px;color:#8093b3}
        .ea-jul26-amber{background:linear-gradient(135deg,rgba(250,204,21,.14),rgba(250,204,21,.04));border-color:rgba(250,204,21,.35)}
        .ea-jul26-amber .ea-jul26-k-v{color:var(--ea-gold)}
        .ea-jul26-down{background:linear-gradient(135deg,rgba(239,68,68,.14),rgba(239,68,68,.04));border-color:rgba(239,68,68,.35)}
        .ea-jul26-down .ea-jul26-k-v{color:#fca5a5}
        .ea-jul26-cyan{background:linear-gradient(135deg,rgba(58,166,255,.14),rgba(58,166,255,.04));border-color:rgba(58,166,255,.35)}
        .ea-jul26-cyan .ea-jul26-k-v{color:#7cc4ff;font-size:22px}
        .ea-jul26-tbl-wrap{background:#fff;color:var(--ea-ink);border-radius:14px;padding:14px;overflow-x:auto;position:relative;z-index:1;box-shadow:0 8px 30px rgba(0,0,0,.15)}
        .ea-jul26-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
        .ea-jul26-tbl th{background:var(--ea-bg);color:var(--ea-muted);font-weight:800;padding:8px 6px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--ea-line)}
        .ea-jul26-tbl th.ea-jul26-l{text-align:left;padding-left:12px}
        .ea-jul26-tbl th.ea-jul26-lh{color:#fff;background:var(--lc);font-size:11px;letter-spacing:.6px;border-radius:6px 6px 0 0;border-bottom:none}
        .ea-jul26-tbl th.ea-jul26-lh-tot{background:linear-gradient(135deg,var(--ea-navy),var(--ea-navy2));color:var(--ea-gold)}
        .ea-jul26-tbl th.ea-jul26-apo{background:linear-gradient(135deg,var(--ea-gold),#ffdf6b);color:var(--ea-navy);font-weight:900;border-radius:6px 6px 0 0}
        .ea-jul26-tbl th.ea-jul26-gs{border-left:2px solid var(--ea-line)}
        .ea-jul26-tbl td{padding:8px 6px;text-align:right;font-family:'Inter',monospace;border-bottom:1px solid #f0f3f9;color:var(--ea-ink);white-space:nowrap}
        .ea-jul26-tbl td.ea-jul26-gs{border-left:2px solid var(--ea-line);color:var(--ea-muted)}
        .ea-jul26-tbl td.ea-jul26-name{text-align:left;font-family:'Inter',sans-serif;font-weight:700;color:var(--ea-navy);padding-left:12px;white-space:normal;max-width:220px;line-height:1.3}
        .ea-jul26-tbl td.ea-jul26-p{font-weight:800}
        .ea-jul26-tbl td.ea-jul26-good{color:var(--ea-good)}
        .ea-jul26-tbl td.ea-jul26-mid{color:var(--ea-mid)}
        .ea-jul26-tbl td.ea-jul26-low{color:var(--ea-low)}
        .ea-jul26-tbl td.ea-jul26-apo-c{color:var(--ea-navy);font-weight:800;background:rgba(250,204,21,.06)}
        .ea-jul26-tbl tbody tr:hover td{background:rgba(58,166,255,.04)}
        .ea-jul26-tbl tbody tr:hover td.ea-jul26-apo-c{background:rgba(250,204,21,.12)}
        .ea-jul26-tbl tr.ea-jul26-totrow td{background:linear-gradient(135deg,var(--ea-navy),var(--ea-navy2)) !important;color:#fff !important;font-weight:900;border-top:3px solid var(--ea-gold);font-size:12.5px}
        .ea-jul26-tbl tr.ea-jul26-totrow td.ea-jul26-name{color:var(--ea-gold) !important}
        .ea-jul26-tbl tr.ea-jul26-totrow td.ea-jul26-p{color:var(--ea-gold) !important}
        .ea-jul26-tbl tr.ea-jul26-totrow td.ea-jul26-tot-apo{background:var(--ea-gold) !important;color:var(--ea-navy) !important}
        .ea-jul26-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:10.5px;color:#8093b3;position:relative;z-index:1}
        @media(max-width:640px){
          .ea-jul26{padding:18px 14px 16px;border-radius:14px}
          .ea-jul26-title{font-size:20px}
          .ea-jul26-kpis{grid-template-columns:1fr 1fr;gap:8px}
          .ea-jul26-kpi{padding:11px 12px}
          .ea-jul26-k-v{font-size:20px}
          .ea-jul26-cyan .ea-jul26-k-v{font-size:16px}
          .ea-jul26-tbl-wrap{padding:8px}
          .ea-jul26-tbl{font-size:10.5px}
        }
        @media print { .no-pdf { display:none !important } }

        /* ===== MODO CAPTURA PDF: colores suaves para ahorrar tinta al imprimir =====
           Se aplica al elemento original y html2canvas hace pantallazo directo.
           Los filtros bajan la saturación (colores menos intensos) y suben un poco
           el brillo del fondo. Los botones .no-pdf se ocultan. */
        .pdf-screenshot-mode { filter: saturate(0.55) brightness(1.05) !important; }
        .pdf-screenshot-mode .no-pdf { display:none !important; }

        /* ===== Promociones del Mes (HTML nativo) ===== */
        .promo-doc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1px solid #e2e8f0;font-family:'Inter',system-ui,sans-serif;color:#0c1f44}
        .promo-doc-head{padding:22px 20px 18px;color:#fff;text-align:center}
        .promo-doc-tag{font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin:0 0 4px;color:#facc15}
        .promo-doc-title{font-size:22px;font-weight:900;text-transform:uppercase;margin:0;line-height:1.15;letter-spacing:-.3px}
        .promo-doc-body{padding:20px 18px}
        .promo-doc-intro{font-size:13px;line-height:1.55;color:#334155;margin:0 0 16px}
        .promo-doc-intro b{color:#0c1f44}
        .promo-doc-foot{background:#f8fafc;padding:12px 20px;text-align:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#4a5a7a;border-top:1px solid #e2e8f0}

        .promo-highlight{border-radius:12px;padding:16px 18px;color:#fff;margin:12px 0}
        .promo-highlight-txt{font-size:16px;font-weight:900;text-align:center;margin:0;line-height:1.35}
        .promo-highlight-txt span{color:#fde68a}
        .promo-highlight-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;text-align:center;margin:6px 0 0;color:#fde68a}

        .promo-section-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:16px 0 8px;padding-bottom:6px;border-bottom:2px solid currentColor}

        .promo-reglas{list-style:none;padding:0;margin:8px 0}
        .promo-reglas li{font-size:12.5px;line-height:1.5;color:#334155;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
        .promo-reglas li i{margin-top:3px;flex-shrink:0}
        .promo-reglas li b{color:#0c1f44}

        .promo-reglas-num{padding-left:22px;margin:8px 0;color:#334155}
        .promo-reglas-num li{font-size:12.5px;line-height:1.6;padding:5px 0;color:#334155}
        .promo-reglas-num li b{color:#0c1f44}
    </style>
</head>
<body>

    <div id="loader" class="fixed inset-0 navy z-[100] flex flex-col items-center justify-center text-white">
        <div class="w-10 h-10 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-extrabold tracking-widest uppercase" style="color:var(--accent)">Sincronizando Tulancingo...</p>
    </div>

    <header id="main-header" class="hidden navy text-white sticky top-0 z-40 shadow-xl" style="border-bottom:2px solid var(--accent)">
        <div class="max-w-xl mx-auto px-4 py-3">
            <div class="flex justify-between items-center gap-2">
                <div class="flex items-center gap-2 min-w-0">
                    <h2 id="header-title" class="font-extrabold uppercase text-sm tracking-tight truncate" style="color:var(--accent)">DASHBOARD</h2>
                    <button onclick="switchOrg()" title="Cambiar organización" class="px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest flex items-center gap-1 shrink-0" style="background:rgba(255,255,255,.1);color:var(--accent);border:1px solid rgba(245,183,0,.3)"><i class="fas fa-right-left text-[8px]"></i>Cambiar</button>
                </div>
                <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:rgba(255,255,255,.1)">
                    <i id="theme-icon" class="fas fa-moon text-sm" style="color:var(--accent)"></i>
                </button>
            </div>
            <p id="update-tag" class="text-[10px] font-bold mt-1" style="color:var(--accent)"></p>
        </div>
    </header>

    <div id="view-cover" class="fixed inset-0 navy-grad z-50 flex flex-col items-center justify-center text-center p-4 text-white">
        <!-- Botón Cotizador esquina superior derecha (solo desktop) -->
        <a href="${''}" id="cotizador-desktop" target="_blank" rel="noopener" class="hidden sm:flex absolute top-4 right-4 items-center gap-2 no-underline glass-btn px-4 py-2.5 rounded-xl shadow-lg" style="background:rgba(255,255,255,.08);border:1px solid rgba(245,183,0,.35);backdrop-filter:blur(10px)">
            <i class="fas fa-calculator text-sm" style="color:var(--accent)"></i>
            <span class="text-[11px] font-black uppercase tracking-widest" style="color:var(--accent)">Cotizador</span>
        </a>

        <div class="max-w-xl w-full">
            <h1 class="text-3xl sm:text-4xl font-black mb-1 leading-tight uppercase" style="color:var(--accent)">GRUPO LLANTERAMA</h1>
            <p class="text-[9px] sm:text-[10px] tracking-[0.4em] mb-8 sm:mb-10 uppercase font-bold" style="color:var(--accent)">Unidad de Inteligencia Comercial</p>
            <p class="text-[10px] uppercase tracking-widest mb-4 text-white/70 font-bold">Seleccione organización</p>
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                <button onclick="enterApp('TUL')" class="glass-btn p-5 sm:p-7 rounded-3xl shadow-2xl flex flex-col items-center gap-2 chip-accent">
                    <i class="fas fa-warehouse text-3xl sm:text-4xl mb-1" style="color:var(--navy)"></i>
                    <p class="text-[9px] sm:text-[10px] font-black uppercase tracking-widest" style="color:var(--navy-2)">Llanterama</p>
                    <p class="text-lg sm:text-2xl font-black uppercase leading-none" style="color:var(--navy)">Tulancingo</p>
                </button>
                <button onclick="enterApp('PZ')" class="glass-btn p-5 sm:p-7 rounded-3xl shadow-2xl flex flex-col items-center gap-2 chip-accent">
                    <i class="fas fa-warehouse text-3xl sm:text-4xl mb-1" style="color:var(--navy)"></i>
                    <p class="text-[9px] sm:text-[10px] font-black uppercase tracking-widest" style="color:var(--navy-2)">Llanterama</p>
                    <p class="text-lg sm:text-2xl font-black uppercase leading-none" style="color:var(--navy)">Poza Rica</p>
                </button>
            </div>

            <!-- Botón Cotizador abajo (solo móvil) -->
            <a href="${''}" id="cotizador-mobile" target="_blank" rel="noopener" class="sm:hidden flex items-center justify-center gap-2 no-underline glass-btn mt-6 py-3 rounded-xl" style="background:rgba(255,255,255,.08);border:1px solid rgba(245,183,0,.35)">
                <i class="fas fa-calculator text-sm" style="color:var(--accent)"></i>
                <span class="text-[11px] font-black uppercase tracking-widest" style="color:var(--accent)">Abrir Cotizador</span>
                <i class="fas fa-arrow-up-right-from-square text-[9px]" style="color:var(--accent)"></i>
            </a>
        </div>
    </div>

    <main class="max-w-xl mx-auto p-4 pb-24"><div id="content-area"></div></main>

    <script>
        // ===== CONFIGURACIÓN POR ORGANIZACIÓN =====
        const ORGS = {
            'TUL': {
                nombre:'TULANCINGO',
                nombreLargo:'Llanterama Tulancingo',
                csv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXDFzkon4Xxv9ydIrVdSW5ER9FweUPFbmE0GI55ca6rFzy-yrjFVmN8kgQ7X0s5oF6k1Wbf8XG4lmX/pub?gid=1217270027&single=true&output=csv',
                cols:{ importe:'IMPORTE NETO' },
                cats:[
                    {n:'Total Acumuladores', o:'OBJ ACUMULADORES', r:'REAL ACUMULADORES', color:'#0f172a'},
                    {n:'Premium',       o:'OBJ PREMIUM',       r:'REAL PREMIUM',       color:'#1e3a8a'},
                    {n:'AGM',           o:'OBJ AGM',           r:'REAL AGM',           color:'#1d4ed8'},
                    {n:'Estándar',      o:'OBJ ESTANDAR',      r:'REAL ESTANDAR',      color:'#3b82f6'},
                    {n:'Value',         o:'OBJ VALUE',         r:'REAL VALUE',         color:'#0ea5e9'},
                    {n:'Lubricantes',   o:'OBJ LUBRICANTES',   r:'REAL LUBRICANTES',   color:'#f97316'},
                    {n:'Motobaterías',  o:'OBJ MOTOBATERIAS',  r:'REAL MOTOBATERIAS',  color:'#ef4444'},
                    {n:'Filtros',       o:'OBJ FILTROS',       r:'REAL FILTROS',       color:'#16a34a'},
                    {n:'Alcalinas',     o:'OBJ ALCALINAS',     r:'REAL ALCALINA',      color:'#9333ea'},
                    {n:'Recolecciones', o:'OBJ RECOLECCIONES', r:'REAL RECOLECCIONES', color:'#64748b'}
                ],
                hasHistorico:true,
                cacheKey:'tul_db_v1'
            },
            'PZ': {

        // Fetch con reintentos y timeout: aguanta caídas cortas de Google Sheets / red débil
        async function fetchWithRetry(url, tries=3){
            let last;
            for(let i=0;i<tries;i++){
                try{
                    const ctrl = new AbortController();
                    const to = setTimeout(()=>ctrl.abort(), 15000);
                    const r = await fetch(url, {signal:ctrl.signal, cache:'no-store'});
                    clearTimeout(to);
                    if(!r.ok) throw new Error('HTTP '+r.status);
                    return r;
                }catch(e){
                    last = e;
                    if(i<tries-1) await new Promise(res=>setTimeout(res, 800*(i+1))); // espera 0.8s, 1.6s
                }
            }
            throw last;
        }

                <p class="text-[11px] font-black tracking-widest uppercase text-center px-6 mb-4" style="color:var(--accent);max-width:340px">${msg}</p>
                ${showRetry?'<button onclick="start()" class="glass-btn chip-accent px-8 py-3 rounded-xl text-[11px] font-black uppercase tracking-widest shadow-2xl"><i class="fas fa-rotate mr-2"></i>Reintentar</button>':''}
            `;
        }

        async function loadOrg(orgKey, force=false){
            const org = ORGS[orgKey];
            if(!force && dbByOrg[orgKey] && dbByOrg[orgKey].length) return {ok:true, cached:true};
            loaderMsg(`Sincronizando ${org.nombre}...`, false);
            try{
                const response = await fetchWithRetry(org.csv + '&t=' + Date.now(), 3);
                const text = await response.text();
                let stamp;
                const lm = response.headers.get('last-modified');
                stamp = lm ? new Date(lm) : new Date();
                return await new Promise((resolve)=>{
                    Papa.parse(text, { header:true, skipEmptyLines:true, complete:(res)=>{
                        const keys = ['MES','AÑO','VENDEDOR','ZONA','SUPERVISOR','TIPO DE VENTA'];
                        const parsed = res.data.map(r=>{ keys.forEach(k=>{ if(k in r) r[k]=norm(r[k]); }); return r; });
                        dbByOrg[orgKey] = parsed;
                        try{ localStorage.setItem(org.cacheKey, JSON.stringify({t:stamp.toISOString(), db:parsed})); }catch(e){}
                        resolve({ok:true, stamp:stamp, cached:false});
                    }});
                });
            }catch(err){
                // fallback a cache
                try{
                    const cached = JSON.parse(localStorage.getItem(org.cacheKey));
                    if(cached && cached.db && cached.db.length){
                        dbByOrg[orgKey] = cached.db;
                        return {ok:true, stamp:new Date(cached.t), cached:true, offline:true};
                    }
                }catch(e){}
                return {ok:false, error:err};
            }
        }

                </div>`;
            });
            document.getElementById('content-area').innerHTML = html;
        }

        function renderReport(v, period){
            const [m,a]=period.split(' ');
            const d = db.find(r => r.VENDEDOR===v && r.MES===m && r.AÑO===a);
            renderDetailedReport(v, period, [d], n(d[COL_IMP()]), false, d.ZONA);
        }

        function renderDetailedReport(titulo, period, dataArr, totalImporte, isGlobal, zonaNombre=""){
            let html = `
            <div class="flex justify-between items-center mb-6">
                ${backBtn(isGlobal?`selectMonth('${period}')`:`renderSellers('${zonaNombre}','${period}')`,"Regresar")}
                <button onclick="downloadPDF('${titulo}')" class="chip-navy px-5 py-2 rounded-xl text-[10px] font-black shadow-lg uppercase tracking-widest">Descargar PDF</button>
            </div>
            <div id="pdf-container">
                <div class="navy p-10 rounded-t-[2.5rem] text-center" style="border-bottom:4px solid var(--accent)">
                    <p class="font-black text-[10px] uppercase tracking-[0.3em] mb-4" style="color:var(--accent)">${period} ${isGlobal?'':'| '+zonaNombre}</p>
                    <h2 class="text-4xl font-black uppercase text-white leading-none mb-8 tracking-tight">${titulo}</h2>
                    <div class="bg-white/10 p-6 rounded-3xl border border-white/5">
                        <p class="text-[11px] font-bold uppercase mb-1 tracking-widest" style="color:#94a3b8">Importe Neto Facturado</p>
                        <p class="text-5xl font-black text-white tracking-tight">$${f(totalImporte)}</p>
                    </div>
                </div>
                <div class="surface-2 p-5 space-y-5 rounded-b-[2.5rem]">
                    ${cats.map(c=>renderProgressItem(dataArr,c)).join('')}
                    <p class="text-center text-[10px] font-bold muted uppercase mt-8 pb-10 tracking-[0.4em]">Llanterama Tulancingo · Inteligencia</p>
                </div>
            </div>`;
            document.getElementById('content-area').innerHTML = html;
            window.scrollTo(0,0);
        }

        function renderProgressItem(dataArr, c){
            const obj = sum(dataArr,c.o);
            const real = sum(dataArr,c.r);
            const perc = obj>0 ? (real/obj)*100 : (real>0?100:0);
            return `
            <div class="surface p-5 rounded-2xl mb-3">
                <div class="flex justify-between items-start mb-4">
                    <h4 class="text-lg font-black uppercase tracking-tight txt">${c.n}</h4>
                    <div class="chip-navy px-3 py-1.5 rounded-xl font-black text-sm">${Math.round(perc)}%</div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="surface-2 p-4 rounded-xl text-center"><p class="text-[9px] font-black muted uppercase mb-1">Vendido</p><p class="text-2xl font-black txt">${real}</p></div>
                    <div class="navy p-4 rounded-xl text-center"><p class="text-[9px] font-black uppercase mb-1" style="color:var(--accent)">Meta</p><p class="text-2xl font-black" style="color:var(--accent)">${obj}</p></div>
                </div>
                <div class="h-3 rounded-full overflow-hidden mt-4" style="background:var(--surface-2)"><div style="width:${Math.min(perc,100)}%; background:${c.color}" class="h-full rounded-full"></div></div>
            </div>`;
        }

        /* ===================== MÓDULO COMPARATIVO ===================== */
        // Alias globales: mismo vendedor con distintos nombres de captura en la hoja
        const VEND_ALIASES = {
            'MIGUEL':          ['MIGUEL','MIGUEL LOZADA'],
            'RUBEN':           ['RUBEN','RUBEN LEON'],
            'CARLOS CALDERON': ['CARLOS CALDERON','ONESIMO']
        };
        function displayOf(v){ const nv=norm(v); for(const [d,al] of Object.entries(VEND_ALIASES)){ if(al.some(a=>norm(a)===nv)) return d; } return nv; }
        function aliasesOf(v){ const nv=norm(v); for(const al of Object.values(VEND_ALIASES)){ if(al.some(a=>norm(a)===nv)) return al.map(norm); } return [nv]; }
        function rowsOf(v, mes, anio){ const als=aliasesOf(v); return db.filter(r=>als.includes(norm(r.VENDEDOR)) && norm(r.MES)===mes && norm(r.AÑO)===anio); }

        // Solo estos vendedores aparecen en el comparativo (nombres unificados)
        const CMP_VENDEDORES = [
            'CS CD SAHAGUN MAYOREO','CS MAYOREO','CS RIO MAYOREO','TIZAYUCA (CELENE)',
            'CARLOS CALDERON','MIGUEL','RUBEN'
        ].map(norm);

        function renderComparativo(){
            // solo vendedores de la lista permitida, con al menos una fila con venta (agrupados por nombre unificado)
            const withData = db.filter(r => r.VENDEDOR && CMP_VENDEDORES.includes(displayOf(r.VENDEDOR)) && (n(r[COL_IMP()])>0 || n(r['REAL ACUMULADORES'])>0));
            const byZona = {};
            withData.forEach(r=>{ (byZona[r.ZONA]=byZona[r.ZONA]||new Set()).add(displayOf(r.VENDEDOR)); });
            let html = `${backBtn("renderMainMenu()","Menú principal")}
                        <p class="text-[10px] font-extrabold muted uppercase tracking-widest mb-4">Comparativo / Seleccione vendedor</p>`;
            Object.keys(byZona).sort().forEach(z=>{
                html += `<p class="text-[11px] font-black uppercase tracking-widest mt-5 mb-2" style="color:var(--brand)">${z}</p>`;
                [...byZona[z]].sort().forEach(v=>{
                    html += `<div onclick="renderCmpVendedor('${esc(v)}')" class="glass-btn surface p-5 rounded-2xl mb-3 flex justify-between items-center" style="border-left:6px solid var(--accent)">
                        <p class="font-black uppercase text-base tracking-tight txt">${v}</p>
                        <i class="fas fa-code-compare muted"></i>
                    </div>`;
                });
            });
            document.getElementById('content-area').innerHTML = html;
        }

        // TODOS los periodos que existen en la data (no por vendedor) -> siempre aparecen ene-jun 2026
        function allPeriods(){
            return [...new Set(db.filter(r=>r.MES && String(r.MES).trim()!=='' && (n(r[COL_IMP()])>0 || n(r['REAL ACUMULADORES'])>0)).map(r=>`${r.MES} ${r.AÑO}`))]
                .sort((a,b)=>{ const [mA,aA]=a.split(' '),[mB,aB]=b.split(' '); return aA!==aB?aB-aA:mesesRef.indexOf(mB)-mesesRef.indexOf(mA); });
        }
        function shortP(p){ const [m,a]=p.split(' '); return m.slice(0,3)+' '+a; }
        const lineaCorta = {
            'Total Acumuladores':'Acumuladores','Premium':'Premium','AGM':'AGM','Estándar':'Estándar','Value':'Value',
            'Lubricantes':'Lubricantes','Motobaterías':'Motobat.','Filtros':'Filtros','Alcalinas':'Alcalinas','Recolecciones':'Recolec.'
        };

        function renderCmpVendedor(v){
            const periods = allPeriods();
            if(periods.length===0){ document.getElementById('content-area').innerHTML='Sin datos'; return; }
            const defA = periods[0];
            const defB = periods[1] || periods[0];
            const optsA = periods.map(p=>`<option value="${p}" ${p===defA?'selected':''}>${p}</option>`).join('');
            const optsB = periods.map(p=>`<option value="${p}" ${p===defB?'selected':''}>${p}</option>`).join('');

            let html = `
            ${backBtn("renderComparativo()","Cambiar vendedor")}
            <div class="navy p-7 rounded-[2rem] mb-5 text-center" style="border-bottom:4px solid var(--accent)">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] mb-2" style="color:var(--accent)">Comparativo de desempeño</p>
                <h2 class="text-3xl font-black uppercase text-white tracking-tight leading-none">${v}</h2>
            </div>

            <div class="surface p-4 rounded-2xl mb-5">
                <p class="text-[11px] font-black muted uppercase tracking-widest mb-3">Selecciona los meses a comparar</p>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[9px] font-black muted uppercase">Mes A</label>
                        <select id="cmp-a" onchange="updateCmp('${esc(v)}')" class="themed w-full mt-1 p-3 rounded-xl font-black text-sm">${optsA}</select>
                    </div>
                    <div>
                        <label class="text-[9px] font-black muted uppercase">Mes B</label>
                        <select id="cmp-b" onchange="updateCmp('${esc(v)}')" class="themed w-full mt-1 p-3 rounded-xl font-black text-sm">${optsB}</select>
                    </div>
                </div>
            </div>

            <div id="cmp-results"></div>

            <div class="flex items-center justify-between mt-9 mb-3">
                <p class="text-[11px] font-black muted uppercase tracking-widest">Rendimiento por mes / año</p>
                <div class="flex gap-2">
                    <button id="am-imp" onclick="setAnnualMetric('${esc(v)}','imp')" class="chip-accent px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Importe $</button>
                    <button id="am-acu" onclick="setAnnualMetric('${esc(v)}','acu')" class="surface txt px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Unidades</button>
                </div>
            </div>
            <div id="cmp-annual"></div>`;
            document.getElementById('content-area').innerHTML = html;
            window.scrollTo(0,0);
            annualMetric = 'imp';
            updateCmp(v);
            renderAnnual(v);
        }

        function getRow(v, periodStr){
            const i = periodStr.lastIndexOf(' ');
            const m = norm(periodStr.slice(0,i)), a = norm(periodStr.slice(i+1));
            const rs = rowsOf(v, m, a);
            if(rs.length===0) return {};
            if(rs.length===1) return rs[0];
            // varios renglones (alias): fusiona sumando numéricos
            const merged = {};
            const numFields = [COL_IMP(), ...cats.map(c=>c.o), ...cats.map(c=>c.r)];
            numFields.forEach(f2=>{ merged[f2] = rs.reduce((s,r)=>s+n(r[f2]),0); });
            return merged;
        }

        function updateCmp(v){
            const pa = document.getElementById('cmp-a').value;
            const pb = document.getElementById('cmp-b').value;
            const ra = getRow(v,pa), rb = getRow(v,pb);
            const impA = n(ra[COL_IMP()]), impB = n(rb[COL_IMP()]);
            const impD = impA - impB;
            const impCol = impD>0?'var(--good)':(impD<0?'var(--bad)':'var(--muted)');
            const impBg  = impD>0?'rgba(22,163,74,.12)':(impD<0?'rgba(220,38,38,.12)':'var(--surface-2)');
            const impLbl = impD>0?'SUPERÁVIT':(impD<0?'DÉFICIT':'IGUAL');

            let filas = cats.map((c,i)=>{
                const obj = n(ra[c.o]);
                const rA  = n(ra[c.r]);
                const rB  = n(rb[c.r]);
                const d   = rA - rB;
                const dCol = d>0?'var(--good)':(d<0?'var(--bad)':'var(--muted)');
                const rACol = obj>0 ? (rA>=obj?'var(--good)':'var(--bad)') : 'var(--text)';
                const cumpl = obj>0 ? Math.round(rA/obj*100) : null;
                const bg = i%2===0 ? 'var(--surface)' : 'var(--surface-2)';
                return `
                <tr style="background:${bg}">
                    <td class="px-3 py-3 text-[13px] font-black uppercase txt">${lineaCorta[c.n]||c.n}</td>
                    <td class="px-2 py-3 text-center text-sm font-bold muted">${obj||'—'}</td>
                    <td class="px-2 py-3 text-center text-base font-black" style="color:${rACol}">${rA}${cumpl!==null?`<span class="block text-[9px] font-bold" style="color:${rACol}">${cumpl}%</span>`:''}</td>
                    <td class="px-2 py-3 text-center text-base font-black txt">${rB}</td>
                    <td class="px-2 py-3 text-center text-base font-black" style="color:${dCol}">${d>0?'+':''}${d}</td>
                </tr>`;
            }).join('');

            const html = `
            <div class="surface rounded-2xl p-4 mb-4">
                <p class="text-[10px] font-black muted uppercase tracking-widest mb-3 text-center">Importe Neto Total</p>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div class="surface-2 rounded-xl py-3 px-2 text-center min-w-0">
                        <p class="text-[10px] font-black muted uppercase mb-1 truncate">${shortP(pa)}</p>
                        <p class="text-lg sm:text-2xl font-black leading-tight whitespace-nowrap" style="color:var(--brand)">$${f(impA)}</p>
                    </div>
                    <div class="surface-2 rounded-xl py-3 px-2 text-center min-w-0">
                        <p class="text-[10px] font-black muted uppercase mb-1 truncate">${shortP(pb)}</p>
                        <p class="text-lg sm:text-2xl font-black leading-tight whitespace-nowrap" style="color:var(--brand)">$${f(impB)}</p>
                    </div>
                </div>
                <div class="rounded-xl py-3 px-3 flex items-center justify-between" style="background:${impBg}">
                    <p class="text-[11px] font-black uppercase" style="color:${impCol}"><i class="fas fa-${impD>0?'arrow-trend-up':(impD<0?'arrow-trend-down':'minus')} mr-1"></i>${impLbl}</p>
                    <p class="text-xl sm:text-2xl font-black leading-none whitespace-nowrap" style="color:${impCol}">${impD>0?'+':''}$${f(impD)}</p>
                </div>
            </div>

            <div class="surface rounded-2xl overflow-hidden">
                <div class="px-4 pt-4 pb-2 flex items-center justify-between">
                    <p class="text-[11px] font-black txt uppercase tracking-widest">Unidades por línea</p>
                    <p class="text-[9px] font-bold muted uppercase">Real vs Objetivo</p>
                </div>
                <div class="overflow-x-auto">
                <table class="w-full" style="border-collapse:collapse">
                    <thead>
                        <tr class="chip-navy">
                            <th class="px-3 py-2 text-left text-[10px] font-black uppercase">Línea</th>
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">Obj</th>
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">${shortP(pa)}</th>
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">${shortP(pb)}</th>
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">A−B</th>
                        </tr>
                    </thead>
                    <tbody>${filas}</tbody>
                </table>
                </div>
                <p class="px-4 py-3 text-[10px] font-bold muted leading-snug" style="border-top:1px solid var(--border)">
                    <span class="c-good">Verde</span> = ${shortP(pa)} vendió más (superávit) · <span class="c-bad">rojo</span> = vendió menos (déficit). El % bajo el real es el cumplimiento vs objetivo.
                </p>
            </div>`;
            document.getElementById('cmp-results').innerHTML = html;
        }

        let annualMetric = 'imp';
        let annualLine = 'REAL ACUMULADORES';
        const uLineas = [
            {k:'REAL ACUMULADORES', o:'OBJ ACUMULADORES', lbl:'Acumuladores'},
            {k:'REAL LUBRICANTES',  o:'OBJ LUBRICANTES',  lbl:'Lubricantes'},
            {k:'REAL MOTOBATERIAS', o:'OBJ MOTOBATERIAS', lbl:'Motobat.'},
            {k:'REAL FILTROS',      o:'OBJ FILTROS',      lbl:'Filtros'}
        ];
        function setAnnualMetric(v, metric){
            annualMetric = metric;
            document.getElementById('am-imp').className = (metric==='imp'?'chip-accent':'surface txt')+' px-3 py-1.5 rounded-lg text-[10px] font-black uppercase';
            document.getElementById('am-acu').className = (metric==='acu'?'chip-accent':'surface txt')+' px-3 py-1.5 rounded-lg text-[10px] font-black uppercase';
            renderAnnual(v);
        }
        function setAnnualLine(v, key){ annualLine = key; renderAnnual(v); }

        function renderAnnual(v){
            const als = aliasesOf(v);
            const mine = db.filter(r=>als.includes(norm(r.VENDEDOR)) && r.MES);
            const years = [...new Set(mine.map(r=>norm(r.AÑO)))].sort((a,b)=>b-a);
            const curr = years[0], prev = years[1];
            const isImp = annualMetric==='imp';
            const linea = uLineas.find(l=>l.k===annualLine) || uLineas[0];
            const field = isImp ? COL_IMP() : linea.k;
            const objField = linea.o;
            const val = (mes,anio)=> mine.filter(r=>norm(r.MES)===mes && norm(r.AÑO)===anio).reduce((s,r)=>s+n(r[field]),0);
            const objV = (mes,anio)=> mine.filter(r=>norm(r.MES)===mes && norm(r.AÑO)===anio).reduce((s,r)=>s+n(r[objField]),0);
            const fmt = x => isImp ? '$'+f(x) : f(x);

            // chips de línea (solo en modo unidades)
            const lineChips = isImp ? '' : `
            <div class="flex flex-wrap gap-2 mb-3">
                ${uLineas.map(l=>`<button onclick="setAnnualLine('${esc(v)}','${l.k}')" class="${l.k===annualLine?'chip-navy':'surface-2 txt'} px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">${l.lbl}</button>`).join('')}
            </div>`;

            const rowsData = mesesRef.map(m=>({m, c:val(m,curr), p:prev?val(m,prev):0, o:objV(m,curr)})).filter(x=>x.c>0 || x.p>0);
            const activos = rowsData.filter(x=>x.c>0);
            const maxV = activos.length ? Math.max(...activos.map(x=>x.c)) : -1;
            const minV = activos.length ? Math.min(...activos.map(x=>x.c)) : -1;

            const ytdC = rowsData.reduce((s,x)=>s+x.c,0);
            const ytdP = rowsData.reduce((s,x)=>s+x.p,0);
            const ytdO = rowsData.reduce((s,x)=>s+x.o,0);
            const ytdDiff = ytdC-ytdP;
            const ytdPct = ytdP!==0 ? (ytdDiff/Math.abs(ytdP))*100 : (ytdC!==0?100:0);
            const good = ytdDiff>=0;
            const cumplYTD = (!isImp && ytdO>0) ? Math.round(ytdC/ytdO*100) : null;

            const filas = rowsData.map(x=>{
                const isHi = x.c===maxV && x.c>0;
                const isLo = x.c===minV && x.c>0 && activos.length>1;
                const d = x.c-x.p;
                const pct = x.p!==0 ? Math.round(d/Math.abs(x.p)*100) : (x.c!==0?100:0);
                const dcol = d>=0?'var(--good)':'var(--bad)';
                const rowbg = isHi?'rgba(22,163,74,.12)':(isLo?'rgba(220,38,38,.10)':'transparent');
                const tag = isHi?'<i class="fas fa-star c-good ml-1"></i>':(isLo?'<i class="fas fa-triangle-exclamation c-bad ml-1"></i>':'');
                return `
                <tr style="background:${rowbg};border-top:1px solid var(--border)">
                    <td class="px-3 py-3 text-[13px] font-black uppercase txt">${x.m.slice(0,3)}${tag}</td>
                    <td class="px-2 py-3 text-center text-base font-black txt">${fmt(x.c)}</td>
                    ${prev?`<td class="px-2 py-3 text-center text-sm font-bold muted">${fmt(x.p)}</td>`:''}
                    <td class="px-2 py-3 text-center text-sm font-black" style="color:${dcol}">${d>=0?'+':''}${f(d)}</td>
                    <td class="px-2 py-3 text-center text-[13px] font-black" style="color:${dcol}">${pct>0?'+':''}${pct}%</td>
                </tr>`;
            }).join('');

            const html = `
            ${lineChips}
            <div class="navy-grad p-6 rounded-[2rem] mb-4 text-white">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-[10px] font-black uppercase tracking-widest" style="color:var(--accent)">Acumulado ${curr}${prev?' vs '+prev:''}${isImp?'':' · '+linea.lbl}</p>
                    <span class="px-3 py-1 rounded-lg text-[12px] font-black" style="background:${good?'var(--good)':'var(--bad)'};color:#fff">${ytdPct>0?'+':''}${Math.round(ytdPct)}%</span>
                </div>
                <p class="text-4xl font-black tracking-tight" style="color:var(--accent)">${fmt(ytdC)}</p>
                ${prev?`<p class="text-[12px] font-bold mt-1" style="color:#94a3b8">${prev}: ${fmt(ytdP)} · Diferencia ${ytdDiff>=0?'+':''}${fmt(ytdDiff)}</p>`:''}
                ${cumplYTD!==null?`<p class="text-[12px] font-black mt-1" style="color:var(--accent)">Cumplimiento vs objetivo: ${cumplYTD}% · ${f(ytdC)} de ${f(ytdO)} pzas</p>`:''}
            </div>

            <div class="surface rounded-2xl overflow-hidden mb-4">
                <div class="overflow-x-auto">
                <table class="w-full" style="border-collapse:collapse">
                    <thead>
                        <tr class="chip-navy">
                            <th class="px-3 py-2 text-left text-[10px] font-black uppercase">Mes</th>
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">${curr}</th>
                            ${prev?`<th class="px-2 py-2 text-center text-[10px] font-black uppercase">${prev}</th>`:''}
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">Dif</th>
                            <th class="px-2 py-2 text-center text-[10px] font-black uppercase">%</th>
                        </tr>
                    </thead>
                    <tbody>${filas}</tbody>
                </table>
                </div>
            </div>
            <p class="text-center text-[10px] font-bold muted uppercase mb-10 tracking-[0.2em]">
                <i class="fas fa-star c-good"></i> Mejor mes &nbsp;·&nbsp; <i class="fas fa-triangle-exclamation c-bad"></i> Mes más bajo
            </p>`;
            document.getElementById('cmp-annual').innerHTML = html;
        }

        /* ===================== MÓDULO GRÁFICAS ===================== */
        let charts = {};
        const grafState = { metric:'imp', year:null, uLine:'REAL ACUMULADORES', vMetric:'imp' };
        const grafLineas = [
            {k:'REAL ACUMULADORES', lbl:'Acumuladores'},
            {k:'REAL LUBRICANTES',  lbl:'Lubricantes'},
            {k:'REAL MOTOBATERIAS', lbl:'Motobat.'},
            {k:'REAL FILTROS',      lbl:'Filtros'}
        ];
        const ZONAS_GRAF = ['TULANCINGO','CS RIO DE LAS AVENIDAS','CS COLOSIO','CS TIZAYUCA','CD SAHAGUN'];
        const familias = [
            {name:'Acumuladores', r:'REAL ACUMULADORES', color:'#1d4ed8'},
            {name:'Lubricantes',  r:'REAL LUBRICANTES',  color:'#f97316'},
            {name:'Motobaterías', r:'REAL MOTOBATERIAS', color:'#ef4444'},
            {name:'Filtros',      r:'REAL FILTROS',      color:'#16a34a'},
            {name:'Alcalinas',    r:'REAL ALCALINA',     color:'#9333ea'},
            {name:'Recolecciones',r:'REAL RECOLECCIONES',color:'#64748b'}
        ];
        const yearColor = { '2024':'#94a3b8', '2025':'#1d4ed8', '2026':'#f5b700' };

        function yearsInData(){
            return [...new Set(db.filter(r=>r.MES && (n(r[COL_IMP()])>0||n(r['REAL ACUMULADORES'])>0)).map(r=>norm(r.AÑO)))].filter(Boolean).sort();
        }
        function monthlySeries(field){
            const out={};
            yearsInData().forEach(y=>{
                out[y]=mesesRef.map(m=>db.filter(r=>norm(r.AÑO)===y && norm(r.MES)===m).reduce((s,r)=>s+n(r[field]),0));
            });
            return out;
        }
        function familyTotals(year){
            return familias.map(fm=>({ name:fm.name, color:fm.color, val:db.filter(r=>norm(r.AÑO)===year).reduce((s,r)=>s+n(r[fm.r]),0) }));
        }
        function vendorTotals(year, field){
            const map={};
            db.filter(r=>norm(r.AÑO)===year && r.VENDEDOR).forEach(r=>{ const v=displayOf(r.VENDEDOR); map[v]=(map[v]||0)+n(r[field]); });
            return Object.entries(map).map(([name,val])=>({name,val})).filter(x=>x.val>0).sort((a,b)=>b.val-a.val).slice(0,10);
        }
        function zonaSeries(){
            // importe neto anual por zona, para cada año
            const out={};
            yearsInData().forEach(y=>{
                out[y]=ZONAS_GRAF.map(z=>db.filter(r=>norm(r.AÑO)===y && norm(r.ZONA)===z).reduce((s,r)=>s+n(r[COL_IMP()]),0));
            });
            return out;
        }
        function destroyCharts(){ Object.values(charts).forEach(c=>{ try{c.destroy();}catch(e){} }); charts={}; }
        function themeColors(){
            const cs=getComputedStyle(document.documentElement);
            return { txt:cs.getPropertyValue('--text').trim(), grid:cs.getPropertyValue('--border').trim(), muted:cs.getPropertyValue('--muted').trim() };
        }

        function setGrafMetric(m){ grafState.metric=m; renderGraficas(); }
        function setGrafYear(y){ grafState.year=y; renderGraficas(); }
        function setGrafULine(k){ grafState.uLine=k; renderGraficas(); }
        function setGrafVMetric(k){ grafState.vMetric=k; renderGraficas(); }

                        ${backBtn("renderMainMenu()","Menú principal")}

                            <p class="text-[13px] txt font-black mb-2">No se pudo cargar la librería de gráficas</p>

            const vIsImp = grafState.vMetric==='imp';

            const uChips = isImp ? '' : `
                <div class="flex flex-wrap gap-2 mb-2">
                    ${grafLineas.map(l=>`<button onclick="setGrafULine('${l.k}')" class="${l.k===grafState.uLine?'chip-navy':'surface-2 txt'} px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">${l.lbl}</button>`).join('')}
                </div>`;
            const vChips = `
                <div class="flex flex-wrap gap-2 mb-2">
                    <button onclick="setGrafVMetric('imp')" class="${vIsImp?'chip-accent':'surface-2 txt'} px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Importe $</button>
                    ${grafLineas.map(l=>`<button onclick="setGrafVMetric('${l.k}')" class="${l.k===grafState.vMetric?'chip-navy':'surface-2 txt'} px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">${l.lbl}</button>`).join('')}
                </div>`;

            let html = `
            ${backBtn("backFromGraficas()","Menú principal")}
            <div class="navy p-6 rounded-[2rem] mb-5 text-center" style="border-bottom:4px solid var(--accent)">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] mb-1" style="color:var(--accent)">Inteligencia Comercial</p>
                <h2 class="text-3xl font-black uppercase text-white tracking-tight leading-none">Gráficas & Tendencias</h2>
            </div>

            <!-- Ventas mensuales por año -->
            <div class="surface rounded-2xl p-4 mb-5">
                <div class="flex items-center justify-between mb-1 flex-wrap gap-2">
                    <p class="text-[13px] font-black uppercase txt tracking-tight">Ventas por mes y año${isImp?'':' · '+uLbl}</p>
                    <div class="flex gap-2">
                        <button onclick="setGrafMetric('imp')" class="${isImp?'chip-accent':'surface-2 txt'} px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Pesos</button>
                        <button onclick="setGrafMetric('acu')" class="${!isImp?'chip-accent':'surface-2 txt'} px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Unidades</button>
                    </div>
                </div>
                ${uChips}
                <p class="text-[10px] muted font-bold mb-3">Compara el mismo mes entre años y detecta despuntes o caídas.</p>
                <div style="position:relative;height:300px"><canvas id="chMonthly"></canvas></div>
            </div>

            <!-- Rendimiento entre zonas -->
            <div class="surface rounded-2xl p-4 mb-5">
                <p class="text-[13px] font-black uppercase txt tracking-tight">Rendimiento entre tiendas</p>
                <p class="text-[10px] muted font-bold mb-3">Venta neta anual de cada zona, año contra año.</p>
                <div style="position:relative;height:320px"><canvas id="chZonas"></canvas></div>
            </div>

            <!-- Familias de producto por año -->
            <div class="surface rounded-2xl p-4 mb-5">
                <p class="text-[13px] font-black uppercase txt tracking-tight">Líneas de producto por año</p>
                <p class="text-[10px] muted font-bold mb-3">Unidades reales acumuladas de cada línea, año contra año.</p>
                <div style="position:relative;height:320px"><canvas id="chFamilies"></canvas></div>
            </div>

            <!-- Selector de año para pastel y vendedores -->
            <div class="surface rounded-2xl p-4 mb-5 flex items-center justify-between">
                <p class="text-[12px] font-black uppercase txt tracking-tight">Detalle del año</p>
                <select onchange="setGrafYear(this.value)" class="themed p-2 rounded-xl font-black text-sm">${yearOpts}</select>
            </div>

            <!-- Mix de líneas (pastel) -->
            <div class="surface rounded-2xl p-4 mb-5">
                <p class="text-[13px] font-black uppercase txt tracking-tight">Mezcla de líneas · ${yr}</p>
                <p class="text-[10px] muted font-bold mb-3">Participación de cada línea en las unidades vendidas.</p>

        function backFromGraficas(){ destroyCharts(); renderMainMenu(); }

        function buildCharts(){
            const tc = themeColors();
            const isImp = grafState.metric==='imp';
            const yr = grafState.year;
            const money = v => isImp ? '$'+f(v) : f(v);
            Chart.defaults.font.family = "'Inter',sans-serif";
            Chart.defaults.color = tc.txt;

            // 1) Línea: ventas por mes y año (con línea de producto seleccionable en unidades)
            const field = isImp ? COL_IMP() : grafState.uLine;
            const ms = monthlySeries(field);
            charts.monthly = new Chart(document.getElementById('chMonthly'), {
                type:'line',
                data:{
                    labels: mesesRef.map(m=>m.slice(0,3)),
                    datasets: Object.keys(ms).map(y=>({
                        label:y, data:ms[y].map(v=>v||null),
                        borderColor:yearColor[y]||'#0ea5e9', backgroundColor:(yearColor[y]||'#0ea5e9')+'22',
                        borderWidth:3, tension:.35, pointRadius:3, pointHoverRadius:6, spanGaps:true, fill:false
                    }))
                },
                options:{ responsive:true, maintainAspectRatio:false,
                    plugins:{ legend:{labels:{font:{weight:'700'},usePointStyle:true}},
                        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${money(c.parsed.y)}`}} },
                    scales:{ x:{grid:{color:tc.grid}}, y:{grid:{color:tc.grid}, ticks:{callback:v=>isImp?('$'+(v/1000000).toFixed(1)+'M'):f(v)}} } }
            });

            // 1b) Barras agrupadas: rendimiento entre zonas (importe anual, año vs año)
            const zs = zonaSeries();
            charts.zonas = new Chart(document.getElementById('chZonas'), {
                type:'bar',
                data:{
                    labels: ZONAS_GRAF.map(z=>z.replace('CS RIO DE LAS AVENIDAS','CS RIO').replace('CS ','CS ')),
                    datasets: Object.keys(zs).map(y=>({ label:y, data:zs[y], backgroundColor:yearColor[y]||'#0ea5e9', borderRadius:6 }))
                },
                options:{ responsive:true, maintainAspectRatio:false,
                    plugins:{ legend:{labels:{font:{weight:'700'},usePointStyle:true}},
                        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: $${f(c.parsed.y)}`}} },
                    scales:{ x:{grid:{display:false}, ticks:{font:{weight:'700',size:9}}}, y:{grid:{color:tc.grid}, ticks:{callback:v=>'$'+(v/1000000).toFixed(0)+'M'}} } }
            });

            // 2) Barras agrupadas: familias por año (unidades)
            const yrs = yearsInData();
            charts.families = new Chart(document.getElementById('chFamilies'), {
                type:'bar',
                data:{
                    labels: familias.map(f=>f.name),
                    datasets: yrs.map(y=>{
                        const tot=familyTotals(y);
                        return { label:y, data:familias.map(fm=>tot.find(t=>t.name===fm.name).val),
                                 backgroundColor:yearColor[y]||'#0ea5e9', borderRadius:6 };
                    })
                },
                options:{ responsive:true, maintainAspectRatio:false,
                    plugins:{ legend:{labels:{font:{weight:'700'},usePointStyle:true}},
                        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${f(c.parsed.y)} u`}} },
                    scales:{ x:{grid:{display:false}, ticks:{font:{weight:'700'}}}, y:{grid:{color:tc.grid}} } }
            });

            // 3) Pastel: mezcla de líneas del año seleccionado (unidades)
            const fam = familyTotals(yr).filter(x=>x.val>0);
            charts.pie = new Chart(document.getElementById('chPie'), {
                type:'doughnut',
                data:{ labels:fam.map(x=>x.name), datasets:[{ data:fam.map(x=>x.val), backgroundColor:fam.map(x=>x.color), borderColor:tc.grid, borderWidth:2 }] },
                options:{ responsive:true, maintainAspectRatio:false, cutout:'55%',
                    plugins:{ legend:{position:'bottom', labels:{font:{weight:'700'},usePointStyle:true,padding:14}},
                        tooltip:{callbacks:{label:c=>{ const t=c.dataset.data.reduce((a,b)=>a+b,0); const p=t?Math.round(c.parsed/t*100):0; return ` ${c.label}: ${f(c.parsed)} u (${p}%)`; }}} } }
            });

            // 4) Barras horizontales: top vendedores por métrica seleccionada
            const vIsImp = grafState.vMetric==='imp';
            const vField = vIsImp ? COL_IMP() : grafState.vMetric;
            const vt = vendorTotals(yr, vField);
            charts.vendors = new Chart(document.getElementById('chVendors'), {
                type:'bar',
                data:{ labels:vt.map(x=>x.name), datasets:[{ label:vIsImp?'Importe':'Unidades', data:vt.map(x=>x.val),
                        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), borderRadius:6 }] },
                options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
                    plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=> vIsImp ? ' $'+f(c.parsed.x) : ' '+f(c.parsed.x)+' u'}} },
                    scales:{ x:{grid:{color:tc.grid}, ticks:{callback:v=> vIsImp ? '$'+(v/1000000).toFixed(1)+'M' : f(v)}}, y:{grid:{display:false}, ticks:{font:{weight:'700',size:10}}} } }
            });
        }

        /* ===================== MÓDULO CONCURSO LUBRICANTES ===================== */
        // display: nombre a mostrar | aliases: variantes de VENDEDOR (col. F) que corresponden a la misma persona
        const CONCURSO_VEND = [
            {display:'CARLOS CALDERON',      aliases:['CARLOS CALDERON','ONESIMO']},
            {display:'MIGUEL',               aliases:['MIGUEL','MIGUEL LOZADA']},
            {display:'RUBEN',                aliases:['RUBEN','RUBEN LEON']},
            {display:'CS RIO MAYOREO',       aliases:['CS RIO MAYOREO']},
            {display:'TIZAYUCA (CELENE)',    aliases:['TIZAYUCA (CELENE)']},
            {display:'CS CD SAHAGUN MAYOREO',aliases:['CS CD SAHAGUN MAYOREO']}
        ];

        function lubOf(aliases, mes){
            const rs = db.filter(x=>aliases.some(a=>norm(x.VENDEDOR)===norm(a)) && norm(x.MES)===mes && norm(x.AÑO)==='2026');
            if(rs.length===0) return {has:false, val:0};
            return {has:true, val:rs.reduce((s,r)=>s+n(r['REAL LUBRICANTES']),0)};
        }
        function objLubActual(aliases){
            // objetivo mensual de lubricante del mes más reciente capturado en 2026
            for(let i=mesesRef.length-1;i>=0;i--){
                const rs = db.filter(x=>aliases.some(a=>norm(x.VENDEDOR)===norm(a)) && norm(x.MES)===mesesRef[i] && norm(x.AÑO)==='2026');
                if(rs.length){ const o=rs.reduce((s,r)=>s+n(r['OBJ LUBRICANTES']),0); if(o>0) return o; }
            }
            return 0;
        }
        function objLubDe(aliases, mes){
            const rs = db.filter(x=>aliases.some(a=>norm(x.VENDEDOR)===norm(a)) && norm(x.MES)===mes && norm(x.AÑO)==='2026');
            if(rs.length===0) return {has:false, val:0};
            return {has:true, val:rs.reduce((s,r)=>s+n(r['OBJ LUBRICANTES']),0)};
        }
        function concursoData(){
            const rows = CONCURSO_VEND.map(({display,aliases})=>{
                const v=display;
                const mar=lubOf(aliases,'MARZO'), abr=lubOf(aliases,'ABRIL');
                const jul=lubOf(aliases,'JULIO'), ago=lubOf(aliases,'AGOSTO');
                const oMar=objLubDe(aliases,'MARZO'), oAbr=objLubDe(aliases,'ABRIL');
                const oJul=objLubDe(aliases,'JULIO'), oAgo=objLubDe(aliases,'AGOSTO');
                const objMes = objLubActual(aliases);
                // BASE (solo referencia informativa, NO participa en la premiación)
                const baseTot = [mar,abr].filter(x=>x.has).reduce((s,x)=>s+x.val,0);
                const baseObj = [oMar,oAbr].filter(x=>x.has).reduce((s,x)=>s+x.val,0);
                const pctBase = baseObj>0 ? (baseTot/baseObj*100) : 0;
                // CONCURSO: litros reales jul+ago vs OBJETIVO TOTAL de cada mes capturado
                const partes = [{r:jul,o:oJul},{r:ago,o:oAgo}].filter(x=>x.r.has);
                const compTot = partes.reduce((s,x)=>s+x.r.val,0);
                const compObj = partes.reduce((s,x)=>s+x.o.val,0);
                const hasComp = partes.length>0;
                const pctComp = (hasComp && compObj>0) ? (compTot/compObj*100) : null;
                return {v,mar,abr,jul,ago,objMes,baseTot,baseObj,pctBase,compTot,compObj,hasComp,pctComp};
            });
            // ranking: mayor % de cumplimiento del objetivo en julio–agosto
            const conComp = rows.filter(r=>r.pctComp!==null).sort((a,b)=>b.pctComp-a.pctComp);
            conComp.forEach((r,i)=>r.pos=i+1);
            return rows;
        }

        function renderConcurso(){
            const data = concursoData();
            const activo = data.some(r=>r.pctComp!==null);
            const lider = data.filter(r=>r.pctComp!==null).sort((a,b)=>b.pctComp-a.pctComp)[0];

            const cel = (o) => o.has ? f(o.val) : '—';

            const cards = data.slice().sort((a,b)=>{
                if(a.pctComp!==null && b.pctComp!==null) return b.pctComp-a.pctComp;

            }).map(r=>{

                let crecBadge;
                if(r.pctComp!==null){
                    const col = r.pctComp>=100?'var(--good)':(r.pctComp>=70?'#b45309':'var(--bad)');

                    crecBadge = `<div class="text-right rounded-xl px-3 py-1.5" style="background:${bg}">
                        <p class="text-[8px] font-black uppercase" style="color:${col}">Cumplimiento</p>
                        <p class="text-xl font-black leading-none" style="color:${col}">${Math.round(r.pctComp)}%</p>

                    </div>`;
                } else {

                }

                const miniCell = (lbl,val,accent)=>`<div class="rounded-lg py-2 text-center" style="background:${accent?'var(--surface)':'var(--surface-2)'}"><p class="text-[8px] font-black muted uppercase mb-0.5">${lbl}</p><p class="text-sm font-black txt">${val}</p></div>`;

                return `
                <div class="surface rounded-2xl p-4 mb-3" ${r.pos===1?'style="border:2px solid #f5b700"':(r.pos===2?'style="border:2px solid #cbd5e1"':'')}>

                    ${r.objMes>0?`<div class="flex items-center gap-2 mb-3 rounded-xl px-3 py-2" style="background:rgba(245,183,0,.12);border:1px dashed var(--accent)">

                        <p class="text-[11px] font-black uppercase" style="color:#b45309">Objetivo mensual lubricante: <span class="text-[13px]">${f(r.objMes)} lts</span></p>
                    </div>`:''}
                    <p class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:#b45309">Concurso · Julio–Agosto · Real vs Objetivo Total</p>
                    <div class="grid grid-cols-3 gap-2 mb-2">
                        ${miniCell('Jul-26', r.jul.has?f(r.jul.val):'Pend.')}
                        ${miniCell('Ago-26', r.ago.has?f(r.ago.val):'Pend.')}
                        ${miniCell('Obj J+A', r.compObj?f(r.compObj):'Pend.')}
                    </div>
                    <div class="flex items-center justify-between rounded-xl px-4 py-2.5 mb-1" style="background:linear-gradient(135deg,#7c3d0a,#b45309)">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-widest text-white"><i class="fas fa-fire mr-1" style="color:#fde68a"></i>Vendido: ${r.hasComp?f(r.compTot)+' lts':'—'}</p>
                            <p class="text-[9px] font-bold uppercase" style="color:#fcd9a8">${r.compObj?('de '+f(r.compObj)+' lts de objetivo total'):'objetivo por capturar'}</p>
                        </div>
                        <p class="text-2xl font-black leading-none" style="color:#fde68a">${r.pctComp!==null?Math.round(r.pctComp)+'%':'—'}</p>
                    </div>
                    <div class="h-2 rounded-full overflow-hidden" style="background:var(--surface-2)"><div style="width:${r.pctComp!==null?Math.min(r.pctComp,100):0}%;background:#f59e0b" class="h-full rounded-full"></div></div>
                </div>`;
            }).join('');

            let html = `
            ${backBtn("renderEstrategias()","Estrategias")}

            <div class="rounded-[2rem] p-7 mb-5 text-center relative overflow-hidden" style="background:linear-gradient(135deg,#3a1d08 0%,#7c3d0a 50%,#b45309 100%);border-bottom:4px solid #fbbf24">
                <i class="fas fa-trophy text-4xl mb-3" style="color:#fbbf24"></i>
                <p class="text-[10px] font-black uppercase tracking-[0.3em] mb-1" style="color:#fde68a">Concurso LTH Lubricantes</p>
                <h2 class="text-3xl font-black uppercase text-white tracking-tight leading-none">Crecimiento en Volumen</h2>
                <p class="text-[12px] font-black uppercase mt-2" style="color:#fde68a">Julio – Agosto 2026</p>
            </div>

            <div class="surface rounded-2xl p-5 mb-5">
                <p class="text-[13px] font-black uppercase txt mb-2 tracking-tight">Estimado equipo de ventas</p>
                <p class="text-[13px] muted leading-relaxed mb-3">Llanterama Tulancingo fue seleccionada dentro del <b class="txt">Top 10 de distribuidores</b> con mayor volumen de ventas de Lubricantes LTH — un reconocimiento a nuestro compromiso y desempeño comercial.</p>
                <p class="text-[13px] muted leading-relaxed">Para celebrarlo, lanzamos un concurso que premia el <b class="txt">cumplimiento de tu objetivo de lubricantes en julio y agosto</b>. Cada quien compite contra su propia meta, en igualdad de condiciones. ¡Es tu oportunidad de ganar!</p>
            </div>

        function exportarConcursoExcel(){
            const data = concursoData();
            // Ordenar por % cumplimiento desc (mismo orden que en pantalla)
            const rows = data.slice().sort((a,b)=>{
                if(a.pctComp!==null && b.pctComp!==null) return b.pctComp-a.pctComp;
                if(a.pctComp!==null) return -1; if(b.pctComp!==null) return 1;
                return b.pctBase-a.pctBase;
            });

            // Encabezados y filas para CSV compacto (Excel lo abre nativo)
            const headers = ['Posición','Vendedor','Objetivo Mensual (lts)','Julio 2026 (lts)','Agosto 2026 (lts)','Objetivo Jul+Ago (lts)','Vendido Jul+Ago (lts)','% Cumplimiento','Estado'];
            const csvRows = [headers];
            rows.forEach((r,i)=>{
                const pos = r.pctComp!==null ? (i+1) : '';
                const estado = r.pctComp===null ? 'Pendiente captura' : (r.pctComp>=100?'Cumplió objetivo':(r.pctComp>=70?'En progreso':'Bajo objetivo'));
                csvRows.push([
                    pos,
                    r.v,
                    r.objMes || 0,
                    r.jul.has ? r.jul.val : '',
                    r.ago.has ? r.ago.val : '',
                    r.compObj || '',
                    r.hasComp ? r.compTot : '',
                    r.pctComp!==null ? Math.round(r.pctComp*10)/10 : '',
                    estado
                ]);
            });

            // Convertir a CSV con separador ; (mejor para Excel en español) y BOM UTF-8 para acentos
            const escapeCell = v => {
                const s = String(v ?? '');
                return (s.includes(';') || s.includes('"') || s.includes('\n')) ? `"${s.replace(/"/g,'""')}"` : s;
            };
            const csv = '\uFEFF' + csvRows.map(row => row.map(escapeCell).join(';')).join('\r\n');

            const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const fecha = new Date().toISOString().slice(0,10);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ConcursoLubricantesLTH_${fecha}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(()=>URL.revokeObjectURL(url), 1000);
        }

        function campParse(csv){
            const rows = Papa.parse(csv, {skipEmptyLines:false}).data;
            // localizar fila de encabezados (misma lógica que el Apps Script del RDV)
            let h = 0;
            for(let i=0;i<Math.min(rows.length,30);i++){
                const r = rows[i].map(norm);
                if(r.includes('VENDEDOR') && (r.includes('COD CLIENTE') || r.includes('CLIENTE'))){ h=i; break; }
            }
            const headers = rows[h].map(x=>String(x||'').trim());
            const data = rows.slice(h+1).filter(r=>r.some(c=>String(c||'').trim()!==''));
            return {headers, data};
        }

        // Cargar 3 CSVs en paralelo (mucho más rápido que Apps Script secuencial)
        async function fetchCsvHoja(url, tries=2){
            let last;
            for(let i=0;i<tries;i++){
                try{
                    const ctrl = new AbortController();
                    const to = setTimeout(()=>ctrl.abort(), 12000); // 12s por hoja
                    const r = await fetch(url + '&t=' + Date.now(), {signal:ctrl.signal, cache:'no-store'});
                    clearTimeout(to);
                    if(!r.ok) throw new Error('HTTP '+r.status);
                    return await r.text();
                }catch(e){
                    last = e;
                    if(i<tries-1) await new Promise(res=>setTimeout(res, 800));
                }
            }
            throw last;
        }

        async function loadCampaniaAgo(){
            const cfg = CAMPANIA_AGO_CONFIG;

                const [tulTxt, autoTxt, pozaTxt] = await Promise.all([
                    fetchCsvHoja(cfg.csvUrls.TULANCINGO),
                    fetchCsvHoja(cfg.csvUrls.AUTO_ROMA),
                    fetchCsvHoja(cfg.csvUrls.POZA_RICA)
                ]);
                const data = {
                    TULANCINGO: Papa.parse(tulTxt,  {header:true, skipEmptyLines:true}).data,
                    AUTO_ROMA:  Papa.parse(autoTxt, {header:true, skipEmptyLines:true}).data,
                    POZA_RICA:  Papa.parse(pozaTxt, {header:true, skipEmptyLines:true}).data
                };
                procesarDataCampania(data);
                campAgoState.stamp = new Date();
                // Guardar en cache local por si algún día la red falla
                try{ localStorage.setItem('camp_ago_v1', JSON.stringify({t:campAgoState.stamp.toISOString(), data:data})); }catch(e){}
                return true;
            }catch(e){
                campAgoState.err = e;
                // Fallback a cache local
                try{
                    const cached = JSON.parse(localStorage.getItem('camp_ago_v1'));
                    if(cached && cached.data){
                        procesarDataCampania(cached.data);
                        campAgoState.stamp = new Date(cached.t);
                        campAgoState.fromCache = true;
                        return true;
                    }
                }catch(err){}
                return false;
            }

        const OVERRIDES_CAMPANIA = {

        function procesarDataCampania(data){
            campAgoState.byCli = {}; campAgoState.apoyo = {};
            for(const orgLabel in data){
                const filas = data[orgLabel] || [];
                filas.forEach(row=>{
                    // Normalizar código: si viene como número (ej: 5955), rellenar con ceros a 6 dígitos (005955)
                    // Códigos alfanuméricos (ej: P01760) se dejan como están
                    let codCliRaw = String(row['Cod de cliente'] || row['COD DE CLIENTE'] || '').trim();
                    if(!codCliRaw) return;
                    const codCli = /^\d+$/.test(codCliRaw) ? codCliRaw.padStart(6,'0') : codCliRaw.toUpperCase();
                    const linea = lineaDeCodigo(row['Codigo'] || row['CODIGO']);
                    const cant = n(row['Cantidad'] || row['CANTIDAD']);
                    const apoyo = n(row['MONTOAPOYO'] || row['MontoApoyo'] || row['MONTO APOYO']);
                    if(!campAgoState.byCli[codCli]) campAgoState.byCli[codCli] = {PREMIUM:0, AGM:0, ESTANDAR:0, VALUE:0};
                    if(linea) campAgoState.byCli[codCli][linea] += cant;
                    campAgoState.apoyo[codCli] = (campAgoState.apoyo[codCli]||0) + apoyo;
                });
            }
            // Aplicar overrides ficticios
            for(const cod in OVERRIDES_CAMPANIA){
                const ov = OVERRIDES_CAMPANIA[cod];
                if(!ov) continue;
                if(!campAgoState.byCli[cod]) campAgoState.byCli[cod] = {PREMIUM:0, AGM:0, ESTANDAR:0, VALUE:0};

                campAgoState.apoyo[cod] = (campAgoState.apoyo[cod]||0) + ov.apoyo;
            }
        }
