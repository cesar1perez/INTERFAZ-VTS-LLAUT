                campAgoUI.selectedCli = new Set(all);
            }
            if(campAgoUI.selectedCli.has(cod)) campAgoUI.selectedCli.delete(cod);
            else campAgoUI.selectedCli.add(cod);
            // Si ya están todos, volver a "todos" (null)
            if(campAgoUI.selectedCli.size === CAMPANIA_AGO_CONFIG.clientes.length){
                campAgoUI.selectedCli = null;
            }
            pintarCampaniaAgo(true);
        }
        function selectAllCli(){
            campAgoUI.selectedCli = null;
            pintarCampaniaAgo(true);
        }
        function selectNoneCli(){
            campAgoUI.selectedCli = new Set();
            pintarCampaniaAgo(true);
        }
        function toggleVerDetalle(){
            campAgoUI.verDetalle = !campAgoUI.verDetalle;
            pintarCampaniaAgo(true);
        }

        function pintarCampaniaAgo(hayApi){
            const cli = CAMPANIA_AGO_CONFIG.clientes;
            const orgNombre = {'TULANCINGO':'Llanterama Tulancingo', 'AUTO_ROMA':'Autoeléctrica Roma', 'POZA_RICA':'Llanterama Poza Rica'};
            const orgShort  = {'TULANCINGO':'Tulancingo', 'AUTO_ROMA':'Auto Roma', 'POZA_RICA':'Poza Rica'};

            // Cálculos por cliente (todos)
            const allRows = cli.map(c=>{
                const real = campAgoState.byCli[c.codCliente] || {PREMIUM:0, AGM:0, ESTANDAR:0, VALUE:0};
                const apoyo = campAgoState.apoyo[c.codCliente] || 0;
                const objTot = c.obj.PREMIUM + c.obj.AGM + c.obj.ESTANDAR + c.obj.VALUE;
                const realTot = real.PREMIUM + real.AGM + real.ESTANDAR + real.VALUE;
                return {...c, real, apoyo, objTot, realTot};
            });
            // Aplicar filtro
            const sel = campAgoUI.selectedCli;
            const rows = sel ? allRows.filter(r=>sel.has(r.codCliente)) : allRows;
            const nSel = rows.length, nTot = allRows.length;

            // Totales del subconjunto visible
            const totObj = {PREMIUM:0, AGM:0, ESTANDAR:0, VALUE:0};
            const totReal = {PREMIUM:0, AGM:0, ESTANDAR:0, VALUE:0};
            let totApoyo = 0;
            rows.forEach(r=>{
                ['PREMIUM','AGM','ESTANDAR','VALUE'].forEach(l=>{
                    totObj[l] += r.obj[l];
                    totReal[l] += r.real[l];
                });
                totApoyo += r.apoyo;
            });
            const objTotG = totObj.PREMIUM + totObj.AGM + totObj.ESTANDAR + totObj.VALUE;
            const realTotG = totReal.PREMIUM + totReal.AGM + totReal.ESTANDAR + totReal.VALUE;
            const avancePct = objTotG>0 ? Math.round(realTotG/objTotG*100) : 0;
            const faltante = objTotG - realTotG;

            const pctCol = p=> p>=100?'ea-jul26-good' : (p>=70?'ea-jul26-mid':'ea-jul26-low');
            const pctCell = (obj, real)=>{
                if(obj===0 && real===0) return '<td class="ea-jul26-gs">—</td><td>—</td><td>—</td>';
                if(obj===0) return `<td class="ea-jul26-gs">—</td><td>${real}</td><td>—</td>`;
                const p = Math.round(real/obj*100);
                return `<td class="ea-jul26-gs">${obj}</td><td>${real||'—'}</td><td class="ea-jul26-p ${pctCol(p)}">${p}%</td>`;
            };
            const pctColSimple = p=> p>=100?'var(--good)':(p>=70?'#b45309':'var(--bad)');

            // ===== Chips de filtro por cliente =====
            const chips = allRows.map(r=>{
                const activo = !sel || sel.has(r.codCliente);
                const styleOn  = 'background:linear-gradient(135deg,#0c1f44,#001529);color:#facc15;border:2px solid #facc15';
                const styleOff = 'background:var(--surface-2);color:var(--muted);border:2px solid var(--border);opacity:.55';
                return `<button onclick="toggleCliFilter('${r.codCliente}')" class="glass-btn px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-tight whitespace-nowrap flex items-center gap-1.5" style="${activo?styleOn:styleOff}">
                    <i class="fas ${activo?'fa-check':'fa-xmark'} text-[9px]"></i>${r.nombre.split(' ').slice(0,2).join(' ')}
                </button>`;
            }).join('');

            const filtroCount = sel ? `${nSel} de ${nTot} clientes` : `${nTot} clientes`;
            const filtroBadge = sel ? `<span class="ml-2 px-2 py-0.5 rounded-full text-[9px] font-black uppercase" style="background:#f97316;color:#fff"><i class="fas fa-filter text-[8px] mr-1"></i>Filtrado</span>` : '';

            const filtroHTML = `
                <div class="surface rounded-2xl p-4 mb-4 no-pdf">
                    <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
                        <p class="text-[11px] font-black uppercase tracking-widest txt"><i class="fas fa-users mr-1" style="color:var(--brand)"></i>Filtrar clientes ${filtroBadge}</p>
                        <div class="flex gap-2">
                            <button onclick="selectAllCli()" class="text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-lg" style="background:var(--surface-2);color:var(--brand)">Todos</button>
                            <button onclick="selectNoneCli()" class="text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-lg" style="background:var(--surface-2);color:var(--brand)">Ninguno</button>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">${chips}</div>
                    <p class="text-[10px] muted mt-2 text-center uppercase tracking-widest">${filtroCount} · toca un chip para incluir/excluir</p>
                </div>`;

            // ===== Barra de vista + PDF =====
            const barraHTML = `
                <div class="flex items-center gap-2 mb-4 no-pdf">
                    <button onclick="toggleVerDetalle()" class="glass-btn flex-1 py-3 rounded-xl text-[11px] font-black uppercase tracking-widest flex items-center justify-center gap-2" style="background:${campAgoUI.verDetalle?'linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff':'var(--surface-2);color:var(--brand)'}">
                        <i class="fas ${campAgoUI.verDetalle?'fa-chevron-up':'fa-chevron-down'}"></i>
                        ${campAgoUI.verDetalle?'Ocultar detalle por línea':'Ver detalle por línea'}
                    </button>
                    <button onclick="descargarPdfCampania()" class="glass-btn py-3 px-4 rounded-xl text-[11px] font-black uppercase tracking-widest flex items-center gap-2" style="background:linear-gradient(135deg,#065f46,#10b981);color:#fff">
                        <i class="fas fa-file-pdf"></i>PDF
                    </button>
                </div>`;

            // ===== Tabla RESUMEN (por defecto) =====
            const tablaResumen = ()=>{
                const orgs = ['TULANCINGO','AUTO_ROMA','POZA_RICA'];
                const cuerpo = orgs.map(o=>{
                    const rowsOrg = rows.filter(r=>r.org===o);
                    if(!rowsOrg.length) return '';
                    const orgRow = `<tr><td colspan="5" style="background:linear-gradient(135deg,rgba(58,166,255,.15),rgba(58,166,255,.05));color:#7cc4ff;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;font-size:10.5px;padding:8px 12px;text-align:left"><i class="fas fa-warehouse mr-2"></i>${orgNombre[o]}</td></tr>`;
                    return orgRow + rowsOrg.map(r=>{
                        const p = r.objTot>0 ? Math.round(r.realTot/r.objTot*100) : 0;
                        return `
                        <tr>
                          <td class="ea-jul26-name">${r.nombre}<br><span style="font-size:9px;color:#7cc4ff;letter-spacing:.5px">COD ${r.codCliente}</span></td>
                          <td class="ea-jul26-gs">${r.objTot}</td>
                          <td>${r.realTot||'—'}</td>
                          <td class="ea-jul26-p ${pctCol(p)}">${r.objTot>0?p+'%':'—'}</td>
                          <td class="ea-jul26-apo-c">${r.apoyo>0? '$'+r.apoyo.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</td>
                        </tr>`;
                    }).join('');
                }).join('');
                const totRow = `
                    <tr class="ea-jul26-totrow">
                      <td class="ea-jul26-name">Totales campaña</td>
                      <td class="ea-jul26-gs">${objTotG}</td>
                      <td>${realTotG||'—'}</td>
                      <td class="ea-jul26-p ${pctCol(avancePct)}">${avancePct}%</td>
                      <td class="ea-jul26-apo-c ea-jul26-tot-apo">$${(totApoyo*1.16).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}<br><span style="font-size:9px;font-weight:700;opacity:.75">Subtotal: $${totApoyo.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></td>
                    </tr>`;
                return `
                <div class="ea-jul26-tbl-wrap">
                  <table class="ea-jul26-tbl">
                    <thead>
                      <tr>
                        <th class="ea-jul26-l">Cliente</th>
                        <th class="ea-jul26-gs">Objetivo</th>
                        <th>Real</th>
                        <th>Avance</th>
                        <th class="ea-jul26-apo">Apoyo $</th>
                      </tr>
                    </thead>
                    <tbody>${cuerpo}${totRow}</tbody>
                  </table>
                </div>`;
            };

            // ===== Tabla DETALLE por línea =====
            const tablaDetalle = ()=>{
                const orgs = ['TULANCINGO','AUTO_ROMA','POZA_RICA'];
                const cuerpo = orgs.map(o=>{
                    const rowsOrg = rows.filter(r=>r.org===o);
                    if(!rowsOrg.length) return '';
                    const orgRow = `<tr><td colspan="15" style="background:linear-gradient(135deg,rgba(58,166,255,.15),rgba(58,166,255,.05));color:#7cc4ff;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;font-size:10.5px;padding:8px 12px;text-align:left"><i class="fas fa-warehouse mr-2"></i>${orgNombre[o]}</td></tr>`;
                    return orgRow + rowsOrg.map(r=>`
                        <tr>
                          <td class="ea-jul26-name">${r.nombre}<br><span style="font-size:9px;color:#7cc4ff;letter-spacing:.5px">COD ${r.codCliente}</span></td>
                          ${pctCell(r.obj.PREMIUM, r.real.PREMIUM)}
                          ${pctCell(r.obj.AGM, r.real.AGM)}
                          ${pctCell(r.obj.ESTANDAR, r.real.ESTANDAR)}
                          ${pctCell(r.obj.VALUE, r.real.VALUE)}
                          <td class="ea-jul26-apo-c">${r.apoyo>0? '$'+r.apoyo.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</td>
                        </tr>`).join('');
                }).join('');
                const totRow = `
                    <tr class="ea-jul26-totrow">
                      <td class="ea-jul26-name">Totales campaña</td>
                      ${pctCell(totObj.PREMIUM, totReal.PREMIUM)}
                      ${pctCell(totObj.AGM,     totReal.AGM)}
                      ${pctCell(totObj.ESTANDAR,totReal.ESTANDAR)}
                      ${pctCell(totObj.VALUE,   totReal.VALUE)}
                      <td class="ea-jul26-apo-c ea-jul26-tot-apo">$${(totApoyo*1.16).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}<br><span style="font-size:9px;font-weight:700;opacity:.75">Subtotal: $${totApoyo.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></td>
                    </tr>`;
                return `
                <div class="ea-jul26-tbl-wrap">
                  <table class="ea-jul26-tbl">
                    <thead>
                      <tr>
                        <th rowspan="2" class="ea-jul26-l">Cliente</th>
                        <th colspan="3" class="ea-jul26-lh" style="--lc:#3aa6ff">Premium</th>
                        <th colspan="3" class="ea-jul26-lh" style="--lc:#a67cff">AGM</th>
                        <th colspan="3" class="ea-jul26-lh" style="--lc:#5eead4">Estándar</th>
                        <th colspan="3" class="ea-jul26-lh" style="--lc:#94a3b8">Value</th>
                        <th rowspan="2" class="ea-jul26-apo">Apoyo $</th>
                      </tr>
                      <tr>
                        <th class="ea-jul26-gs">Obj</th><th>Real</th><th>Avance</th>
                        <th class="ea-jul26-gs">Obj</th><th>Real</th><th>Avance</th>
                        <th class="ea-jul26-gs">Obj</th><th>Real</th><th>Avance</th>
                        <th class="ea-jul26-gs">Obj</th><th>Real</th><th>Avance</th>
                      </tr>
                    </thead>
                    <tbody>${cuerpo}${totRow}</tbody>
                  </table>
                </div>`;
            };

            // ===== FICHA para 1 solo cliente (más profesional para enviar por WhatsApp) =====
            const fichaCliente = (r)=>{
                const lineas = [
                    {k:'PREMIUM', label:'Premium', color:'#1e3a8a'},
                    {k:'AGM',     label:'AGM',     color:'#7c3aed'},
                    {k:'ESTANDAR',label:'Estándar',color:'#0891b2'},
                    {k:'VALUE',   label:'Value',   color:'#64748b'}
                ];
                const filasLineas = lineas.filter(l=> r.obj[l.k]>0 || r.real[l.k]>0).map(l=>{
                    const obj = r.obj[l.k], real = r.real[l.k];
                    const p = obj>0 ? Math.round(real/obj*100) : 0;
                    const barra = obj>0 ? Math.min(p,100) : 0;
                    return `
                    <div class="mb-3">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[12px] font-black uppercase tracking-wider" style="color:${l.color}">${l.label}</span>
                            <span class="text-[12px] font-black" style="color:${obj>0?pctColSimple(p):'var(--muted)'}">${real} / ${obj>0?obj:'—'} ${obj>0?'· '+p+'%':''}</span>
                        </div>
                        ${obj>0 ? `<div class="h-2 rounded-full overflow-hidden" style="background:var(--surface-2)"><div style="width:${barra}%;background:${l.color}" class="h-full rounded-full"></div></div>` : `<div class="h-2 rounded-full" style="background:var(--surface-2)"></div>`}
                    </div>`;
                }).join('') || '<p class="text-center muted text-[12px] py-3">Sin compras en agosto todavía</p>';

                const pTot = r.objTot>0 ? Math.round(r.realTot/r.objTot*100) : 0;

                return `
                <div style="background:#fff;color:#0c1f44;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e2e8f0">
                    <div style="border-bottom:2px solid #facc15;padding-bottom:14px;margin-bottom:16px">
                        <p style="font-size:10px;font-weight:900;color:#7cc4ff;letter-spacing:2px;text-transform:uppercase;margin:0">Ficha del cliente · Agosto 2026</p>
                        <h3 style="font-size:22px;font-weight:900;color:#0c1f44;margin:4px 0 2px;line-height:1.15;text-transform:uppercase;letter-spacing:-.5px">${r.nombre}</h3>
                        <p style="font-size:11px;font-weight:800;color:#4a5a7a;letter-spacing:1px;text-transform:uppercase;margin:0">COD ${r.codCliente} · ${orgShort[r.org]}</p>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
                        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px">
                            <p style="font-size:10px;font-weight:900;color:#4a5a7a;text-transform:uppercase;margin:0 0 4px">Avance total</p>
                            <p style="font-size:28px;font-weight:900;color:${pctColSimple(pTot)};margin:0;line-height:1">${r.objTot>0?pTot+'%':'—'}</p>
                            <p style="font-size:11px;color:#4a5a7a;margin:2px 0 0">${r.realTot} de ${r.objTot} acumuladores</p>
                        </div>
                        <div style="background:linear-gradient(135deg,#facc15,#eab308);border-radius:12px;padding:12px">
                            <p style="font-size:10px;font-weight:900;color:#7c2d12;text-transform:uppercase;margin:0 0 4px">Total neto</p>
                            <p style="font-size:20px;font-weight:900;color:#0c1f44;margin:0;line-height:1">$${(r.apoyo*1.16).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>
                            <p style="font-size:10px;color:#7c2d12;font-weight:700;margin:2px 0 0">Subtotal: $${r.apoyo.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>
                        </div>
                    </div>

                    <p style="font-size:11px;font-weight:900;color:#4a5a7a;text-transform:uppercase;letter-spacing:1.5px;margin:0 0 10px">Detalle por línea</p>
                    ${filasLineas}

                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:10px;color:#4a5a7a;text-align:center">
                        <p style="margin:0">Recuperación de venta de Acumuladores · Agosto 2026</p>
                        <p style="margin:2px 0 0">Grupo Llanterama · Financia Clarios</p>
                    </div>
                </div>`;
            };

            // Decidir vista: ficha si es 1 solo, tabla si son varios
            let cuerpoTablas;
            if(rows.length === 1){
                cuerpoTablas = fichaCliente(rows[0]);
            } else if(rows.length === 0){
                cuerpoTablas = `<div class="surface rounded-2xl p-10 text-center"><i class="fas fa-filter-circle-xmark text-4xl muted mb-3"></i><p class="text-[13px] muted">Sin clientes seleccionados. Toca "Todos" para ver la campaña completa.</p></div>`;
            } else {
                cuerpoTablas = campAgoUI.verDetalle ? tablaDetalle() : tablaResumen();
            }

            // Aviso si estamos mostrando datos de cache (red falló pero teníamos copia)
            const avisoCache = campAgoState.fromCache ? `
                <div class="surface rounded-2xl p-4 mb-4 flex items-center gap-3 no-pdf" style="border-left:6px solid #f97316">
                    <i class="fas fa-cloud-arrow-down text-lg" style="color:#f97316"></i>
                    <p class="text-[12px] muted leading-snug"><b class="txt">Modo sin conexión:</b> no se pudo actualizar. Mostrando última copia guardada del ${campAgoState.stamp ? campAgoState.stamp.toLocaleString('es-MX',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}. <button onclick="renderCampaniaAgo()" class="underline font-black" style="color:#f97316">Reintentar</button></p>
                </div>` : '';

            // Aviso si aún no hay URLs configuradas
            const avisoConfig = !hayApi ? `
                <div class="surface rounded-2xl p-4 mb-4 flex items-center gap-3 no-pdf" style="border-left:6px solid #b45309">
                    <i class="fas fa-hourglass-half text-lg" style="color:#b45309"></i>
                    <p class="text-[12px] muted leading-snug"><b class="txt">Datos reales pendientes:</b> faltan las URLs CSV de las 3 hojas en <code style="color:#0891b2">CAMPANIA_AGO_CONFIG.csvUrls</code>.</p>
                </div>` : '';

            const avisoErr = (hayApi && campAgoState.err) ? `
                <div class="surface rounded-2xl p-4 mb-4 flex items-center gap-3 no-pdf" style="border-left:6px solid var(--bad)">
                    <i class="fas fa-triangle-exclamation text-lg" style="color:var(--bad)"></i>
                    <p class="text-[12px] muted leading-snug"><b class="txt">No se pudo descargar del Google Sheet.</b> ${String(campAgoState.err.message||campAgoState.err)}</p>
                </div>` : '';

            document.getElementById('content-area').innerHTML = `
            ${backBtn("renderEstrategias()","Estrategias")}
            ${filtroHTML}
            ${barraHTML}
            <div id="camp-ago-pdf">
              <section class="ea-jul26">
                <div class="ea-jul26-badge"><span class="ea-jul26-dot"></span>Estrategia en curso · datos en vivo</div>
                <header class="ea-jul26-head">
                  <div class="ea-jul26-tag">Estrategia especial · Agosto 2026</div>
                  <h2 class="ea-jul26-title">Recuperación de venta de <span>Acumuladores</span></h2>
                  <p class="ea-jul26-sub">Objetivo AGOSTO 2026 vs facturado · seguimiento en tiempo real · <b>Financia Clarios</b></p>
                </header>
                <div class="ea-jul26-kpis">
                  <div class="ea-jul26-kpi">
                    <div class="ea-jul26-k-l">Acumuladores facturados</div>
                    <div class="ea-jul26-k-v">${realTotG}</div>
                    <div class="ea-jul26-k-s">agosto en curso</div>
                  </div>
                  <div class="ea-jul26-kpi ea-jul26-amber">
                    <div class="ea-jul26-k-l">Objetivo total</div>
                    <div class="ea-jul26-k-v">${objTotG}</div>
                    <div class="ea-jul26-k-s">${sel?nSel+' de '+nTot+' clientes':nTot+' clientes'}</div>
                  </div>
                  <div class="ea-jul26-kpi ea-jul26-down">
                    <div class="ea-jul26-k-l">Faltante</div>
                    <div class="ea-jul26-k-v">${faltante>=0?'−'+faltante:'+'+Math.abs(faltante)}</div>
                    <div class="ea-jul26-k-s">avance ${avancePct}% del objetivo</div>
                  </div>
                  <div class="ea-jul26-kpi ea-jul26-cyan">
                    <div class="ea-jul26-k-l">Total neto</div>
                    <div class="ea-jul26-k-v">$${(totApoyo*1.16).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
                    <div class="ea-jul26-k-s">Subtotal: $${totApoyo.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
                  </div>
                </div>
                ${avisoCache}
                ${avisoConfig}
                ${avisoErr}
                ${cuerpoTablas}
                <footer class="ea-jul26-foot">
                  <span>${rows.length===1?'Reporte individual':rows.length+' clientes'} · financia Clarios</span>
                  <span>${campAgoState.stamp?'Actualizado: '+campAgoState.stamp.toLocaleString('es-MX',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Sin datos en vivo'} · Grupo Llanterama / Autoeléctrica Roma</span>
                </footer>
              </section>
            </div>`;
            window.scrollTo(0,0);
        }

        function descargarPdfCampania(){
            const el = document.getElementById('camp-ago-pdf');
            if(!el){ alert('Nada que exportar'); return; }
            // Cargar html2pdf on-demand (ahorra ~250 KB en el arranque)
            if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
                const preloader = document.createElement('div');
                preloader.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff';
                preloader.innerHTML = '<div class="w-12 h-12 border-4 rounded-full animate-spin mb-4" style="border-color:#facc15;border-top-color:transparent"></div><p class="text-[12px] font-black uppercase tracking-widest" style="color:#facc15">Preparando exportación...</p>';
                document.body.appendChild(preloader);
                cargarHtml2Pdf().then(()=>{
                    document.body.removeChild(preloader);
                    descargarPdfCampania();
                }).catch(err=>{
                    document.body.removeChild(preloader);
                    alert('No se pudo cargar la librería PDF. Verifica tu conexión.');
                });
                return;
            }
            const rows = campAgoUI.selectedCli ? Array.from(campAgoUI.selectedCli) : [];
            const nombre = rows.length===1
                ? 'Ficha_' + (CAMPANIA_AGO_CONFIG.clientes.find(c=>c.codCliente===rows[0])||{nombre:'cliente'}).nombre.replace(/[^\w]+/g,'_').slice(0,30)
                : 'CampañaAcumuladores_Ago2026';

            // Loader
            const loader = document.createElement('div');
            loader.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff';
            loader.innerHTML = '<div class="w-12 h-12 border-4 rounded-full animate-spin mb-4" style="border-color:#facc15;border-top-color:transparent"></div><p class="text-[12px] font-black uppercase tracking-widest" style="color:#facc15">Generando pantallazo...</p>';
            document.body.appendChild(loader);

            // Aplicar filtro "colores suaves" temporalmente al elemento original (visual solo para captura)
            el.classList.add('pdf-screenshot-mode');

            // html2canvas viene dentro de html2pdf.bundle
            html2canvas(el, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            }).then(canvas=>{
                el.classList.remove('pdf-screenshot-mode');

                // Crear PDF con la imagen escalada a A4 vertical
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
                const pageW = pdf.internal.pageSize.getWidth();   // 210
                const pageH = pdf.internal.pageSize.getHeight();  // 297
                const margin = 8;
                const usableW = pageW - margin*2;   // 194
                const usableH = pageH - margin*2;   // 281

                // Escalar la imagen manteniendo proporción para que quepa completa
                const imgRatio = canvas.width / canvas.height;
                const boxRatio = usableW / usableH;
                let w, h;
                if(imgRatio > boxRatio){
                    // más ancha que alta relativamente → ajustar por ancho
                    w = usableW;
                    h = w / imgRatio;
                } else {
                    // más alta que ancha → ajustar por alto
                    h = usableH;
                    w = h * imgRatio;
                }
                const x = (pageW - w) / 2;
                const y = (pageH - h) / 2;

                const imgData = canvas.toDataURL('image/jpeg', 0.92);
                pdf.addImage(imgData, 'JPEG', x, y, w, h, undefined, 'FAST');

                const blobUrl = pdf.output('bloburl');
                document.body.removeChild(loader);
                mostrarPreviewPdf(blobUrl, nombre + '.pdf');
            }).catch(err=>{
                el.classList.remove('pdf-screenshot-mode');
                if(loader.parentNode) document.body.removeChild(loader);
                console.error('PDF error:', err);
                alert('Error al generar PDF: ' + err.message);
            });
        }

        function mostrarPreviewPdf(blobUrl, filename){
            const overlay = document.createElement('div');
            overlay.id = 'pdf-preview-overlay';
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(12,31,68,.95);z-index:99999;display:flex;flex-direction:column;padding:12px';
            overlay.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#fff;gap:10px">
                    <div>
                        <p style="font-size:9px;font-weight:900;color:#facc15;letter-spacing:2px;text-transform:uppercase;margin:0">Vista previa</p>
                        <p style="font-size:13px;font-weight:900;margin:2px 0 0;text-transform:uppercase;letter-spacing:.5px">${filename}</p>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <button id="pdf-preview-download" style="background:linear-gradient(135deg,#065f46,#10b981);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px"><i class="fas fa-download"></i>Descargar</button>
                        <button id="pdf-preview-print" style="background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px"><i class="fas fa-print"></i>Imprimir</button>
                        <button id="pdf-preview-close" style="background:rgba(255,255,255,.15);color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center"><i class="fas fa-xmark"></i></button>
                    </div>
                </div>
                <iframe src="${blobUrl}" style="flex:1;width:100%;background:#fff;border:none;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)"></iframe>
            `;
            document.body.appendChild(overlay);

            document.getElementById('pdf-preview-download').onclick = ()=>{
                const a = document.createElement('a');
                a.href = blobUrl; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };
            document.getElementById('pdf-preview-print').onclick = ()=>{
                const w = window.open(blobUrl, '_blank');
                if(w) setTimeout(()=>{ try{ w.print(); }catch(e){} }, 500);
            };
            document.getElementById('pdf-preview-close').onclick = ()=>{
                document.body.removeChild(overlay);
                URL.revokeObjectURL(blobUrl);
            };
        }

                                    <th style="padding:10px;text-align:right;font-size:10px;letter-spacing:1px;text-transform:uppercase">C/IVA</th>
                                    <th style="padding:10px;text-align:right;font-size:10px;letter-spacing:1px;text-transform:uppercase">P/Unitario</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
                <div class="promo-doc-foot">Vigente hasta nuevo aviso · Fuerza de Ventas</div>
            </div>`;
        }

        const PROMOS_AGOSTO_DEFS = [
            {t:'Promoción de Motobatería',        icono:'fa-motorcycle',   color:'#dc2626', builder: promoMotobateriaHTML},
            {t:'Promoción de Lubricante',         icono:'fa-oil-can',      color:'#c2410c', builder: promoLubricanteHTML},
            {t:'Precios Pila Alcalina LTH',       icono:'fa-battery-full', color:'#7c3aed', builder: promoPilaAlcalinaHTML}
        ];

        function abrirPromoDoc(idx, empresa){
            const p = PROMOS_AGOSTO_DEFS[idx];
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(12,31,68,.96);z-index:9999;display:flex;flex-direction:column;padding:12px;overflow-y:auto';
            overlay.innerHTML = `
                <div class="flex items-center justify-between mb-3 shrink-0" style="gap:12px;max-width:640px;margin:0 auto;width:100%">
                    <div>
                        <p style="font-size:10px;font-weight:900;color:#facc15;letter-spacing:2px;text-transform:uppercase;margin:0">${empresa}</p>
                        <p class="text-[13px] font-black uppercase tracking-tight text-white truncate">${p.t}</p>
                    </div>
                    <button onclick="this.closest('div[style*=fixed]').remove()" class="w-10 h-10 rounded-full flex items-center justify-center text-white shrink-0" style="background:rgba(255,255,255,.15)"><i class="fas fa-xmark text-lg"></i></button>
                </div>
                <div style="max-width:640px;margin:0 auto;width:100%">${p.builder()}</div>
            `;
            overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
            document.body.appendChild(overlay);
        }

        function renderPromosAgosto(){
            const orgActual = currentOrg === 'PZ' ? 'POZA RICA' : 'TULANCINGO';
            const empresa = currentOrg === 'PZ' ? 'Llanterama Poza Rica' : 'Llanterama Tulancingo';
            const barra = currentOrg === 'PZ' ? 'linear-gradient(135deg,#1e3a8a,#3b82f6)' : 'linear-gradient(135deg,#001529,#facc15)';

            const cards = PROMOS_AGOSTO_DEFS.map((p,i)=>`
                <div onclick="abrirPromoDoc(${i},'${empresa}')" class="glass-btn surface rounded-2xl overflow-hidden mb-4" style="border-left:6px solid ${p.color}">
                    <div class="p-5 flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl text-white shrink-0 shadow-md" style="background:${p.color}"><i class="fas ${p.icono}"></i></div>
                        <div class="flex-1 min-w-0">
                            <p class="text-[14px] font-black uppercase txt tracking-tight leading-tight">${p.t}</p>
                            <p class="text-[10px] font-bold muted uppercase tracking-widest mt-1">Tocar para ver detalles <i class="fas fa-arrow-right text-[8px] ml-1"></i></p>
                        </div>
                    </div>
                </div>`).join('');

            const html = `
            ${backBtn("renderEstrategias()","Estrategias")}
            <div class="rounded-[2rem] p-7 mb-6 text-center text-white" style="background:linear-gradient(135deg,#0e7490,#0891b2 50%,#06b6d4);border-bottom:4px solid #67e8f9">
                <i class="fas fa-tags text-4xl mb-3" style="color:#cffafe"></i>
                <p class="text-[10px] font-black uppercase tracking-[0.3em] mb-1" style="color:#cffafe">Promociones vigentes · Ventas Mayoreo</p>
                <h2 class="text-3xl font-black uppercase tracking-tight leading-none">Promociones del Mes</h2>
                <p class="text-[11px] font-bold uppercase mt-2" style="color:#cffafe">Agosto 2026</p>
            </div>
            <div class="rounded-[1.75rem] p-5 mb-5 text-white" style="background:${barra}">
                <p class="text-[10px] font-black uppercase tracking-[0.3em]" style="color:#facc15">Empresa</p>
                <h3 class="text-2xl font-black uppercase leading-none">${orgActual}</h3>
            </div>
            ${cards}
            <p class="text-center text-[10px] font-bold muted mt-2 mb-10 leading-snug uppercase tracking-widest">Fuerza de Ventas · ${empresa}</p>`;
            document.getElementById('content-area').innerHTML = html;
            window.scrollTo(0,0);
        }

        /* ===================== HELPERS ===================== */
        // Botón de regreso: flecha grande en círculo, fácil de identificar
        function backBtn(action, label){
            return `<button onclick="${action}" class="glass-btn mb-6 flex items-center gap-3">
                <span class="w-12 h-12 rounded-full navy flex items-center justify-center shadow-lg shrink-0" style="color:var(--accent);border:2px solid var(--accent)"><i class="fas fa-arrow-left text-xl"></i></span>
                <span class="text-[11px] font-black muted uppercase tracking-widest">${label}</span>
            </button>`;
        }
        function n(v){ if(!v) return 0; const clean=String(v).replace(/[$,]/g,"").trim(); return parseFloat(clean)||0; }
        function norm(x){ return String(x==null?'':x).replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim(); }
        function f(v){ return Math.round(v).toLocaleString('es-MX'); }
        function esc(s){ return String(s).replace(/'/g,"\\'"); }
        function sum(dataArr, field){ if(!field) return 0; return dataArr.reduce((acc,r)=>acc+Math.round(n(r[field])),0); }
        function toggleDropdown(id){ document.getElementById(id).classList.toggle('dropdown-active'); }
        function downloadPDF(name){
            if(typeof html2pdf === 'undefined'){
                cargarHtml2Pdf().then(()=>downloadPDF(name)).catch(()=>alert('No se pudo cargar la librería PDF. Verifica tu conexión.'));
                return;
            }
            const element = document.getElementById('pdf-container');
            html2pdf().set({ margin:[10,5,10,5], filename:`${currentOrg}_${name}.pdf`, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'} }).from(element).save();
        }

        // La carga inicia cuando el usuario elige organización (enterApp)
        document.getElementById('loader').classList.add('hidden');
        // Conectar botones del Cotizador al URL configurado
        ['cotizador-desktop','cotizador-mobile'].forEach(function(id){
            var el = document.getElementById(id);
            if(el) el.setAttribute('href', COTIZADOR_URL);
        });
    </script>
</body>
</html>
